# DOA (delegation-of-authority) roster — EXAMPLE.
#
# Point FIELD_DOA_ROSTER at a copy of this file to turn the mint gate on:
#   export FIELD_DOA_ROSTER=/data/doa-roster.yaml
# Keep it directly under /data, NOT under /data/manifests: on the GB10 from
# v1.2 Phase C that is the read-only field-manifests volume, written only by
# `manifests-admin install`, which refuses anything that is not a FIELD
# manifest. A roster there is frozen for good.
#
# While the variable is UNSET (the default in compose, fly and CI, and on both
# estates today) delegation-authority mints exactly as it did before and
# records `doa_checked: false` on the ledger event.
#
# What this file is: an operator-maintained membership list. It proves that a
# `granted_by` STRING is on a list, with a scope envelope and a TTL ceiling.
# What it is NOT: authentication. Nothing verifies that the caller is the
# person named — see the "Declared only" row in the service README.
#
# Parsed by delegation_authority.doa with extra="forbid": an unknown key here
# is a 503 at mint time, not a silently ignored line.

grantors:
  - grantor: Don Hagell, Spin State Labs # must equal `granted_by` exactly
    # Union of the delegation.scope lists in manifests/ssl-invoicing-agent.yaml
    # and manifests/ssl-timekeeping-agent.yaml. A mint is refused (403
    # D.grantor) for any scope not on this list, and refused again (422
    # D.scope) for any scope the AGENT's own manifest does not declare — the
    # roster widens nothing.
    allowed_scope:
      - read timesheets
      - read customer profile
      - draft invoice document
      - create zoho invoice
      - draft invoice email
      - read calendars and email
      - read timesheet xlsx
      - draft daily timesheet
      - write timesheet xlsx
      - enter time in client portal
    max_ttl_days: 30
    # Recorded on the delegation.mint ledger row AND (v1.2 D1e) stamped on
    # every token minted under this row. conformance-sentinel enforces it:
    # once the agent's governor-metered spend since the token was issued
    # reaches it, /check BLOCKs E.spend_cap. It needs a USD spend cap on the
    # agent (another currency BLOCKs; no cap ESCALATEs). Delete the line for
    # no ceiling.
    max_spend_usd: 500.0
    active: true # set false to retire a grantor without deleting the row

  # --- Phase G JOB identities (design v0.4 section 2.2.1 + amendment P22, code
  # change C-13, RT1-4) -------------------------------------------------------
  # Job identities are grantors in their own right. Their operator rows hold
  # `mint` but NOT `mint_for_others`, so under FIELD_OPERATOR_REQUIRE the
  # delegation authority accepts their mint only with granted_by == the job id,
  # and `lifecycle provision` (no --grantor) and `renew_token.py`
  # (--operator-id) mint exactly that. Each row's allowed_scope is exactly the
  # scopes that job mints, and max_ttl_days is 31 (renew_token mints at most 30
  # days). No max_spend_usd. A grantor string must be unique in this list.
  # The bound is per GRANTOR, not per agent (Declared, PG0-CLI-R1-03): the DOA
  # gate checks the granted_by row (active), scope and ttl only, so a job may
  # mint any subset of its row's union scope, for 31 days at most, for ANY
  # registered agent id (for example job-renewal-rog could give
  # ssl-timekeeping-agent an invoicing scope). That is narrower than
  # mint_for_others (RT1-4), but it is not "this agent's scopes only"; a
  # per-agent bound would need an agent field in the roster.
  # These rows used to live in a companion doa-roster.jobs.example.yaml that
  # had to be appended by hand (R2-04); they are folded in here so a copy of
  # this file is the whole roster. tools/generate_doa_roster.py builds rows
  # from the registry and the manifests only, which name no job id: pass
  # `--job-rows <this roster>` to carry every `job-*` row over verbatim, or a
  # regenerated roster refuses the next job mint (403 D.grantor).
  # tools/tests/test_job_grantors_c13.py arms a copy of THIS file verbatim in
  # the real estate harness under ENFORCE and checks these rows against the
  # manifests.
  - grantor: job-provision-gb10
    # Self-agent provisioning from the GB10 host venv (D-L): the ordered union of
    # delegation.scope in manifests/conformance-sentinel.yaml,
    # manifests/force-gateway.yaml and manifests/compliance-crosswalk.yaml.
    allowed_scope:
      - read agent manifests
      - evaluate action conformance
      - append conformance verdicts
      - invoke semantic scope judge
      - llm.messages
      - inject force preset blocks
      - observe hygiene telemetry
      - invoke hygiene judge
      - append gateway events
      - read regulatory corpus
      - report coverage gaps
      - suggest candidate mappings
      - draft evidence packs
    max_ttl_days: 31
    active: true

  - grantor: job-renewal-rog
    # The two Windows renewal tasks on rog-command (P22: kept on the PC):
    # \FIELD\token-renewal-ssl-timekeeping-agent and
    # \FIELD\token-renewal-ssl-invoicing-agent. Exactly the renewed scopes: the
    # union of delegation.scope in manifests/ssl-timekeeping-agent.yaml, then
    # manifests/ssl-invoicing-agent.yaml.
    allowed_scope:
      - read calendars and email
      - read timesheet xlsx
      - draft daily timesheet
      - write timesheet xlsx
      - enter time in client portal
      - read timesheets
      - read customer profile
      - draft invoice document
      - create zoho invoice
      - draft invoice email
    max_ttl_days: 31
    active: true

  # job-renewal-gb10 renews volatility-trader from the GB10 cron (T4). That
  # agent's manifest is not in this repository, so its scopes are not written
  # here: copy the four delegation.scope entries of
  # /data/manifests/volatility-trader.yaml on the GB10 into allowed_scope, in
  # that order, and uncomment. Until then the armed roster refuses that job's
  # mint with 403 D.grantor and the renewal changes nothing.
  # - grantor: job-renewal-gb10
  #   allowed_scope: []   # exactly volatility-trader's delegation.scope
  #   max_ttl_days: 31
  #   active: true
