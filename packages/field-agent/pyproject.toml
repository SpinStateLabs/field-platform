[project]
name = "field-agent"
version = "0.1.0"
description = "FIELD Platform client SDK: put a Python agent under governance - sentinel-checked actions, metered LLM usage, kill-switch liveness. A client, not an authority."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Spin State Labs" }]
dependencies = [
    "field-core",
    "conformance-sentinel",
    "httpx>=0.27",
    "pydantic>=2.7",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "fastapi>=0.111",
    "agent-registry",
    "sealed-ledger",
    "delegation-authority",
    "spend-governor",
    "kill-switch",
    "federation-broker",
]

[project.scripts]
fieldagent = "field_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/field_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
