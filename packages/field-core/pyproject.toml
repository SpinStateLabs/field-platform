[project]
name = "field-core"
version = "0.1.0"
description = "Single source of truth for FIELD Platform schemas: manifest models, validation, ledger hash-chain primitives, delegation tokens, conformance verdicts."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Spin State Labs" }]
dependencies = [
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
field = "field_core.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/field_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
