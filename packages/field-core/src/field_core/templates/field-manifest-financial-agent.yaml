# FIELD Governance Manifest — FINANCIAL-AGENT template
# For FP&A / audit-adjacent agents. 7-year ledger retention, sealed. Kill switch tied to spend cap.
# Fill every REPLACE-ME before deploying.  Validate with:  /field validate
schema_version: field.spinstatelabs.ca/v1

agent:
  name: REPLACE-ME financial agent name
  description: FP&A / audit-adjacent agent producing analysis and deliverables under source discipline
  version: "0.1.0"

# F — Federated. Financial agents are isolated unless a specific integration requires a peer.
federated:
  isolated: true
  allowed_peers: []
  contracts: []

# I — Identity. Regulated financial work: declare the jurisdictions that govern it.
identity:
  principal: REPLACE-ME principal (e.g. Controller, VP Finance)
  org: REPLACE-ME organization
  jurisdiction:
    - SOX
    - PIPEDA
  data_scope:
    may_access:
      - general ledger (read)
      - planning models (read)
    may_retain:
      - working analysis
    may_transmit:
      - approved deliverables to named recipients only
  model_provider: REPLACE-ME

# E — Enforcement. Kill switch tied to the spend cap; irreversible financial actions require a human.
enforcement:
  kill_switch:
    endpoint: REPLACE-ME halt endpoint
    method: REPLACE-ME (e.g. HTTP POST, file)
    authorized_operators:
      - REPLACE-ME Controller
      - REPLACE-ME Head of FP&A
  spend_cap:
    currency: USD
    limit: 500
    period: daily
    on_breach: halt        # breaching the cap fires the kill switch
  irreversible_action_policy: require_human_approval
  escalation_triggers:
    - any journal entry or posting
    - any figure that changes a reported total
    - any external send
  # Claude Code Enforcement Gate (field plugin v1.1+) — the keys below are enforced at runtime.
  # kill_switch.method: file  -> endpoint is a sentinel-file path; while it exists every gated
  #   tool call is denied (/field kill creates it). Any other method still gets the default
  #   sentinel .claude/state/KILL.
  rate_limits:
    - action: tool_call        # per-session tool-call budget (runtime proxy for spend_cap)
      max: 200
      period: session
  # irreversible_actions:      # Bash commands matching these Python regexes are denied outright
  #   deny_patterns:
  #     - '\brm\s+-rf\b'
  #     - '\bgit\s+push\s+.*--force'
  # protected_paths: []        # extra regexes for paths Edit/Write may not touch
  #                            # (the manifest, ledger and .claude/settings*.json are built in)

# L — Ledger. 7-year retention for financial audit. Sealed.
ledger:
  cryptographic_seal: true
  seal_algorithm: ed25519-signed-chain
  retention_days: 2555     # 7 years
  logged_events:
    - every action
    - every source read
    - every figure produced
    - every escalation
    - every spend
  store: REPLACE-ME append-only / WORM store (or file://./.field/ledger.jsonl for the local gate)

# D — Delegation. Narrow, expiring, revocable.
delegation:
  granted_by: REPLACE-ME authorizing principal
  scope:
    - read financial sources
    - produce analysis and draft deliverables
  expiry: "2027-01-01"     # review at least annually
  revocation:
    method: REPLACE-ME
    endpoint: REPLACE-ME

# Runtime protocol — audit preset (F+R+C+E): source-grounding on, objections-first off.
runtime_protocol:
  name: FORCE
  version: "1.0"
  preset: audit
