# FIELD Governance Manifest — READ-ONLY-AGENT template
# For retrieval / analysis agents with ZERO write authority. No write delegation. Reduced enforcement surface.
# Fill every REPLACE-ME before deploying.  Validate with:  /field validate
schema_version: field.spinstatelabs.ca/v1

agent:
  name: REPLACE-ME read-only agent name
  description: Retrieval / analysis agent. Reads and reasons; never writes, sends, or transacts.
  version: "0.1.0"

# F — Federated. Isolated retrieval agent.
federated:
  isolated: true
  allowed_peers: []
  contracts: []

# I — Identity. Read scope only — nothing retained externally, nothing transmitted.
identity:
  principal: REPLACE-ME principal
  org: REPLACE-ME organization
  jurisdiction:
    - REPLACE-ME
  data_scope:
    may_access:
      - REPLACE-ME read sources
    may_retain: []          # retains nothing beyond the session
    may_transmit: []        # transmits nothing
  model_provider: REPLACE-ME

# E — Enforcement. All one-way actions forbidden outright — the agent is structurally read-only.
enforcement:
  kill_switch:
    endpoint: REPLACE-ME halt endpoint
    method: REPLACE-ME (e.g. HTTP POST, file)
    authorized_operators: []
  irreversible_action_policy: forbid
  escalation_triggers:
    - any request that would require a write, send, or transaction
  # Claude Code Enforcement Gate (field plugin v1.1+) — the keys below are enforced at runtime.
  # kill_switch.method: file  -> endpoint is a sentinel-file path; while it exists every gated
  #   tool call is denied (/field kill creates it). Any other method still gets the default
  #   sentinel .claude/state/KILL.
  rate_limits:
    - action: tool_call        # per-session tool-call budget (runtime proxy for spend_cap)
      max: 200
      period: session
  # irreversible_actions:      # Bash commands matching these Python regexes are denied outright
  #   deny_patterns:
  #     - '\brm\s+-rf\b'
  #     - '\bgit\s+push\s+.*--force'
  # protected_paths: []        # extra regexes for paths Edit/Write may not touch
  #                            # (the manifest, ledger and .claude/settings*.json are built in)

# L — Ledger. Lighter retention; still sealed. Reads are logged for traceability.
ledger:
  cryptographic_seal: true
  seal_algorithm: sha-256-merkle
  retention_days: 90
  logged_events:
    - every source read
    - every query
    - every escalation
  store: REPLACE-ME append-only store (or file://./.field/ledger.jsonl for the local gate)

# D — Delegation. Read authority only. No write action may appear in scope.
# NOTE: the schema does not machine-enforce scope contents — keeping this read-only is the
# operator's responsibility. /field validate warns but cannot block a write verb here.
delegation:
  granted_by: REPLACE-ME authorizing principal
  scope:
    - read and summarize authorized sources
  expiry: "2027-01-01"
  revocation:
    method: REPLACE-ME
    endpoint: REPLACE-ME

# Runtime protocol — analysis preset (full FORCE).
runtime_protocol:
  name: FORCE
  version: "1.0"
  preset: analysis
