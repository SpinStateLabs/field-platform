[project]
name = "field-mcp"
version = "0.1.0"
description = "FIELD Platform MCP server: Tier 1 read tools for the platform services over stdio; read-only by default."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "field-core",
    "httpx>=0.27",
    "mcp==2.3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ffmcp-read = "field_mcp.server:main_read"
ffmcp-write = "field_mcp.server:main_write"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/field_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
