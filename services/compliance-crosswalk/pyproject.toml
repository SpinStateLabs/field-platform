[project]
name = "compliance-crosswalk"
version = "0.1.0"
description = "FIELD Platform compliance-crosswalk service: manifest fields mapped to OSFI E-23, EU AI Act, NIST AI RMF and ISO/IEC 42001 (pending text purchase) control requirements, with source-grounded citations, evidence packs, and content-change detection of the cited sources."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "field-core",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "typer>=0.12",
    "httpx>=0.27",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "sealed-ledger", "agent-registry", "delegation-authority"]

[project.scripts]
crosswalk = "compliance_crosswalk.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compliance_crosswalk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
