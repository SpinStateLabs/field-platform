[project]
name = "sealed-ledger"
version = "0.1.0"
description = "FIELD Platform sealed-ledger service: append-only, sha-256 hash-chained event ledger with verification and auditor export."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "field-core",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
ledger = "sealed_ledger.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sealed_ledger"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
