[project]
name = "attestation-reporter"
version = "0.1.0"
description = "FIELD Platform attestation-reporter: one command renders the board pack from live services — no number without a source query."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "field-core",
    "typer>=0.12",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "fastapi>=0.111", "sealed-ledger", "agent-registry", "delegation-authority", "spend-governor"]

[project.scripts]
attest = "attestation_reporter.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/attestation_reporter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
