# The FORCE Gateway's OWN FIELD manifest (ADR 10 S4-pattern).
# The Gateway is an observer governed by the instrument the platform
# enforces: Founder & CTO is the named accountability owner (ADR 10 s4);
# the delegation scope is observer verbs only (inject/observe/invoke/
# append - the Gateway never blocks or mutates); enforcement.spend_cap
# is the sampled hygiene-judge budget the governor meters (apply with:
# governor set-cap force-gateway --from-manifest <this file>).
# Validated by tests/test_gateway_delta.py.
schema_version: field.spinstatelabs.ca/v1
agent:
  name: force-gateway
  description: 'LLM-traffic proxy: injects FORCE runtime constraints per route and
    observes hygiene telemetry. An observer that fails open — it never blocks production
    traffic.'
  version: 0.1.0
federated:
  isolated: true
  allowed_peers: []
  contracts: []
identity:
  principal: Founder & CTO, Spin State Labs
  org: Spin State Labs
  jurisdiction:
  - PIPEDA
  data_scope:
    may_access: []
    may_retain: []
    may_transmit: []
  model_provider: Anthropic
enforcement:
  kill_switch:
    endpoint: http://127.0.0.1:8005/kill/force-gateway
    method: HTTP POST
    authorized_operators: []
  irreversible_action_policy: require_human_approval
  escalation_triggers: []
  spend_cap:
    currency: USD
    limit: 5
    period: daily
    on_breach: halt
ledger:
  cryptographic_seal: true
  seal_algorithm: sha-256-merkle
  retention_days: 365
  logged_events:
  - every action
  - every escalation
  - every delegation use
  store: sealed-ledger service (hash-chained JSONL)
delegation:
  granted_by: Founder & CTO, Spin State Labs
  scope:
  - inject force preset blocks
  - observe hygiene telemetry
  - invoke hygiene judge
  - append gateway events
  expiry: '2027-06-30'
  revocation:
    method: HTTP POST
    endpoint: http://127.0.0.1:8003/tokens/{id}/revoke
runtime_protocol:
  name: FORCE
  version: '1.0'
  preset: analysis
