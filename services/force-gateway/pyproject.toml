[project]
name = "force-gateway"
version = "0.1.0"
description = "FIELD Platform force-gateway service: reverse proxy for the Anthropic Messages API that injects FORCE preset system blocks and records deterministic hygiene telemetry."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "field-core",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "typer>=0.12",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
forcegw = "force_gateway.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/force_gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
