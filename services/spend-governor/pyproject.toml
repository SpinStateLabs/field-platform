[project]
name = "spend-governor"
version = "0.1.0"
description = "FIELD Platform spend-governor service: deterministic spend metering vs. manifest caps; threshold escalation before the hard stop."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "field-core",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "typer>=0.12",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "sealed-ledger"]

[project.scripts]
governor = "spend_governor.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spend_governor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
