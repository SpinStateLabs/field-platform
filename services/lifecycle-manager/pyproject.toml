[project]
name = "lifecycle-manager"
version = "0.1.0"
description = "FIELD Platform lifecycle-manager: scheduled sweep over registry + delegation — expiring authorities, re-attestation due, orphan detection, optional auto-kill."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "field-core",
    # `lifecycle provision` derives the spend cap with the governor's OWN
    # arithmetic (SpendCapConfig.from_manifest) so the two can never disagree
    # about a cent. Runtime, not dev — precedent: field-agent depends on
    # conformance-sentinel. The string must equal the dist name in
    # services/spend-governor/pyproject.toml, and both Docker images already
    # install lifecycle-manager AFTER spend-governor.
    "spend-governor",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "typer>=0.12",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "sealed-ledger", "agent-registry", "delegation-authority", "kill-switch"]

[project.scripts]
lifecycle = "lifecycle_manager.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lifecycle_manager"]

[tool.pytest.ini_options]
testpaths = ["tests"]
