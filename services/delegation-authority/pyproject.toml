[project]
name = "delegation-authority"
version = "0.1.0"
description = "FIELD Platform delegation-authority service: mint scoped, expiring, revocable delegation tokens; every mint/revoke is a sealed-ledger event."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "field-core",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "typer>=0.12",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "sealed-ledger", "agent-registry"]

[project.scripts]
delegation = "delegation_authority.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/delegation_authority"]

[tool.pytest.ini_options]
testpaths = ["tests"]
