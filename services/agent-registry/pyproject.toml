[project]
name = "agent-registry"
version = "0.1.0"
description = "FIELD Platform agent-registry service: agent identity records + shadow-agent discovery scanner."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "field-core",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
registry = "agent_registry.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_registry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
