[project]
name = "ops-console"
version = "0.1.0"
description = "FIELD Platform ops-console: the human's dashboard over every governed agent — observe, kill, revive, drill, revoke, resolve, and dry-run actions against the sentinel."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "field-core",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "typer>=0.12",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "sealed-ledger", "agent-registry", "delegation-authority", "spend-governor", "kill-switch", "conformance-sentinel"]

[project.scripts]
console = "ops_console.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ops_console"]

[tool.pytest.ini_options]
testpaths = ["tests"]
