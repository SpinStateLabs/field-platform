[project]
name = "federation-broker"
version = "0.1.0"
description = "FIELD Platform federation-broker service: inter-org gateway validating counterparty manifests against federation contracts; every crossing is a ledger event."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "field-core",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "typer>=0.12",
    "httpx>=0.27",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "sealed-ledger"]

[project.scripts]
fedbroker = "federation_broker.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/federation_broker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
