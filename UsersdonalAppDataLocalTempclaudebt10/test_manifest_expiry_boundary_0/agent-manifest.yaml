schema_version: field.spinstatelabs.ca/v1
agent:
  name: rt-mint-agent
  description: REPLACE-ME one line on what this agent does
  version: 0.1.0
federated:
  isolated: true
  allowed_peers: []
  contracts: []
identity:
  principal: Red Team Grantor, Test Org
  org: REPLACE-ME organization
  jurisdiction:
  - REPLACE-ME
  data_scope:
    may_access: []
    may_retain: []
    may_transmit: []
  model_provider: REPLACE-ME
enforcement:
  kill_switch:
    endpoint: REPLACE-ME halt endpoint (where the stop signal goes; a sentinel-file
      path when method is file)
    method: REPLACE-ME (e.g. HTTP POST, OS signal, queue message, file)
    authorized_operators: []
  irreversible_action_policy: require_human_approval
  escalation_triggers: []
  rate_limits:
  - action: tool_call
    max: 200
    period: session
ledger:
  cryptographic_seal: true
  seal_algorithm: sha-256-merkle
  retention_days: 365
  logged_events:
  - every action
  - every escalation
  - every delegation use
  store: REPLACE-ME ledger store (e.g. file://./.field/ledger.jsonl for the local
    gate, or an append-only / WORM store)
delegation:
  granted_by: Red Team Grantor, Test Org
  scope:
  - read timesheets
  - draft invoices
  - send invoice email
  expiry: '2026-10-23T17:52:29+00:00'
  revocation:
    method: REPLACE-ME
    endpoint: REPLACE-ME
runtime_protocol:
  name: FORCE
  version: '1.0'
  preset: analysis
