# FIELD Platform CI. Mirrors the local install/test procedure in
# docs/IMPLEMENTATION.md. NOTE: per-service test runs use `python -m pytest`
# (not bare `pytest`) — conformance-sentinel's tests import `tests.conftest`,
# which needs the service CWD on sys.path (run #1 failed exactly here).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install platform
        run: |
          python -m pip install --upgrade pip
          pip install -e "packages/field-core[dev]"
          for s in sealed-ledger agent-registry delegation-authority \
                   spend-governor kill-switch conformance-sentinel \
                   incident-replay compliance-crosswalk force-gateway \
                   federation-broker lifecycle-manager attestation-reporter \
                   ops-console claude-approver; do
            pip install --no-deps -e "services/$s"
          done
          # --no-deps: field-agent depends on conformance-sentinel, which is
          # not on PyPI — everything it needs is already installed above.
          pip install --no-deps -e "packages/field-agent"
          # defence-shield/agent-incident-retro: pydantic, typer, field-core come from field-core above.
          pip install --no-deps -e "defence-shield/agent-incident-retro"
          pip install fastapi uvicorn httpx pytest
      - name: Vendored field-agent templates in sync
        run: bash plugins/field-agent/verify_sync.sh
      - name: Test field-core + non-conftest services
        # agent-registry moved to the per-service loop below (v1.2 D3b): its
        # tests/conftest.py points FIELD_MANIFEST_DIR at its fixtures, and in
        # this one repo-root run pytest's rootdir is packages/field-core, so
        # kill-switch's autouse conftest (which deletes FIELD_MANIFEST_DIR)
        # applied to the registry's tests too and 4 of them got 422.
        run: >
          pytest -q packages/field-core/tests services/sealed-ledger/tests
          services/delegation-authority/tests
          services/spend-governor/tests services/kill-switch/tests
          services/federation-broker/tests
      - name: Test tools (estate_probe deploy-gate verifier, DOA roster generator)
        # estate_probe: boots two real estates (every service's create_app under
        # Caddy-like prefixes) and asserts every probe check both passes on a
        # healthy estate and FAILS on the breakage it exists to catch — nine
        # fault-injected false greens from the 2026-09-12 adversarial review.
        # test_field_rest_secret.py needs Windows PowerShell and skips here.
        # Operator events under the GB10 ledger configuration (caller keyring +
        # FIELD_LEDGER_REQUIRE_CALLER_SIGNATURE=1, fake keys): test_phase_g_check_caller_signed.py
        # and test_signed_opev_eight_services.py run here; the former also fails if this
        # step stops collecting them or filters them out (-k/-m/--ignore/--deselect).
        run: pytest -q tools/tests
      - name: Deployed-topology lint (fail-open env vars armed on deployed estates)
        # Red-team plan item M3. Statically reads the shipped compose/Fly
        # descriptors; fails if FIELD_SHARED_SECRET or FIELD_DOA_ROSTER is not
        # armed on a deployed topology unless recorded in
        # tools/topology_lint_allowlist.yaml. No docker, no network.
        # It also RUNS integration/fly/entrypoint.sh under bash with stub services
        # (prints 'entrypoint behavioural check: RAN') and fails, never skips,
        # if bash is missing while CI is set.
        run: python tools/topology_lint.py
      - name: Test services with local conftest/imports
        run: |
          for s in agent-registry conformance-sentinel incident-replay compliance-crosswalk \
                   force-gateway lifecycle-manager attestation-reporter \
                   ops-console claude-approver; do
            (cd "services/$s" && python -m pytest -q tests)
          done
          (cd packages/field-agent && python -m pytest -q tests)
          (cd defence-shield/agent-incident-retro && python -m pytest -q tests)

  compose-smoke:
    # x86_64 counterpart to the GB10 (aarch64) verification of 2026-08-08.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build and start the stack
        working-directory: integration/demo
        # v1.2 D2: compose no longer passes --mock; FORCE_GATEWAY_MOCK=1 (exactly 1)
        # reaches forcegw through its ${FORCE_GATEWAY_MOCK:-} passthrough.
        # v1.2 F1: FORCE_GATEWAY_ENFORCE=1 (exactly 1) makes /v1/messages fail closed on
        # identity + authority; the roundtrip below provisions an agent and proves it.
        run: |
          docker compose build
          FORCE_GATEWAY_ENFORCE=1 FORCE_GATEWAY_MOCK=1 docker compose up -d
      - name: Health checks (every service through the single proxy port)
        # Bounded per-prefix retry (thirteen cold uvicorn starts on one vCPU)
        # replaces the old fixed sleep: up to 30 x 2 s per prefix, fail if a
        # prefix never answers.
        run: |
          wait_health() {
            for i in $(seq 1 30); do
              curl -sf --max-time 5 "$1" > /dev/null && return 0
              sleep 2
            done
            echo "::error::$1 never answered within 60 s"
            return 1
          }
          for svc in registry ledger delegation sentinel killswitch governor replay gateway federation lifecycle attest crosswalk; do
            wait_health "http://localhost:8080/$svc/health" || exit 1
          done
          # console owns the proxy root (catch-all handle) — its /health proves it
          wait_health "http://localhost:8080/health" || exit 1
      - name: Phase G plumbing is inert by default (flags blank, operators directory and daemon key directories mounted read-only)
        working-directory: integration/demo
        # No flag is armed here: the eight operator-auth services see the flags as
        # blank (mode OFF) and the committed placeholder directory (one zero-row
        # operators.json) as a read-only mount (B-6). The four daemons (C-1) see their
        # identity name, the key-file path /run/field/keys/svc-<name>.key and the
        # committed EMPTY key placeholder inside their own read-only key directory
        # (PG0-COMPOSE-R1-01); no other service has an identity or a key mount.
        run: |
          for svc in registry ledger delegation killswitch governor fedbroker console lifecycle; do
            docker compose exec -T "$svc" sh -c 'test -z "$FIELD_OPERATOR_REGISTRY" && test -z "$FIELD_OPERATOR_REQUIRE" && grep -q operators /run/field/operators/operators.json && ! ( : >> /run/field/operators/operators.json ) 2>/dev/null && ! ( : > /run/field/operators/.ci-probe ) 2>/dev/null'               || { echo "::error::$svc: operator plumbing not inert/read-only"; exit 1; }
          done
          for svc in registry delegation killswitch lifecycle; do
            docker compose exec -T "$svc" sh -c 'test "$FIELD_OPERATOR" = "svc-'"$svc"'" && test "$FIELD_OPERATOR_KEY_FILE" = /run/field/keys/svc-'"$svc"'.key && test -z "$(printenv FIELD_OPERATOR_KEY)" && test -f /run/field/keys/svc-'"$svc"'.key && test ! -s /run/field/keys/svc-'"$svc"'.key && ! ( : >> /run/field/keys/svc-'"$svc"'.key ) 2>/dev/null && ! ( : > /run/field/keys/.ci-probe ) 2>/dev/null'               || { echo "::error::$svc: daemon identity or key mount not inert/read-only"; exit 1; }
          done
          for svc in ledger governor fedbroker console sentinel; do
            docker compose exec -T "$svc" sh -c 'test -z "$(printenv FIELD_OPERATOR)" && test -z "$(printenv FIELD_OPERATOR_KEY_FILE)" && test ! -e /run/field/keys'               || { echo "::error::$svc: carries a daemon identity or key mount"; exit 1; }
          done
          docker compose exec -T sentinel sh -c 'test -z "$(printenv FIELD_OPERATOR_REGISTRY)" && test ! -e /run/field/operators'
      - name: Phase G C-6 ledger operator observer is on (startup operator.mode_changed and operator.registry_changed rows for each of the eight operator-block services, mode off)
        # FIELD_LEDGER_OBSERVE_EVERY=60 on the ledger: a service not yet up at the ledger's start-up
        # tick is recorded on the next one, so the script waits up to 150 s.
        run: python3 integration/demo/fixtures/c6-observer/check_rows.py http://localhost:8080/ledger
      - name: Key rotation R2 — the proxy refuses /operator/verify-hash and /operator/rotation-state except from its own loopback
        # Static twin: tools/tests/test_kr_edge_block_r2.py. From the runner (never the proxy's loopback)
        # Caddy itself answers 403 for every prefix; from inside the proxy container the request reaches
        # the service (404 there: the operator layer is OFF, so the routes answer as absent).
        run: |
          python3 integration/demo/fixtures/kr-edge/check_edge_block.py http://localhost:8080
          for path in registry/operator/rotation-state killswitch/operator/rotation-state operator/rotation-state; do
            out=$(docker compose -f integration/demo/docker-compose.yml exec -T proxy wget -S -O /dev/null "http://127.0.0.1:8080/$path" 2>&1 || true)
            echo "$out" | grep -q 'HTTP/1.1 404' || { echo "::error::loopback /$path did not reach the service: $out"; exit 1; }
          done
          out=$(docker compose -f integration/demo/docker-compose.yml exec -T proxy wget -S -O /dev/null --post-data '{}' "http://127.0.0.1:8080/ledger/operator/verify-hash" 2>&1 || true)
          echo "$out" | grep -q 'HTTP/1.1 404' || { echo "::error::loopback verify-hash did not reach the ledger: $out"; exit 1; }
      - name: Gateway roundtrip, ENFORCING (F1) — provisioned smoke agent 401 bare, 200 with headers, 403 E.kill_switch after a kill, gateway.refused ledgered
        run: |
          # base compose: /data/manifests is on the shared field-data volume — any service can place the manifest
          docker compose -f integration/demo/docker-compose.yml exec -T sentinel sh -c 'mkdir -p /data/manifests && cat > /data/manifests/smoke-egress.yaml' \
            < integration/demo/fixtures/compose-smoke/smoke-egress.yaml
          curl -sf -X POST http://localhost:8080/registry/agents -H 'content-type: application/json' \
            -d '{"agent_id":"smoke-egress","name":"Smoke egress","owner":"CI","domain":"test","manifest_ref":"/data/manifests/smoke-egress.yaml"}'
          curl -sf -X PUT http://localhost:8080/governor/caps/smoke-egress -H 'content-type: application/json' \
            -d '{"agent_id":"smoke-egress","limit_cents":500,"period":"daily","escalate_at_pct":80}'
          TOKEN=$(curl -sf -X POST http://localhost:8080/delegation/tokens -H 'content-type: application/json' \
            -d '{"agent_id":"smoke-egress","granted_by":"CI","scope":["smoke test","llm.messages"],"ttl_seconds":600}' \
            | python3 -c "import sys,json;print(json.load(sys.stdin)['token_id'])")
          BODY='{"model":"claude-x","max_tokens":16,"messages":[{"role":"user","content":"ping"}]}'
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/gateway/v1/messages -H 'content-type: application/json' -d "$BODY")
          test "$code" = 401 || { echo "::error::no headers answered $code, want 401"; exit 1; }
          MODEL=$(curl -sf -X POST http://localhost:8080/gateway/v1/messages -H 'content-type: application/json' \
            -H 'x-field-agent-id: smoke-egress' -H "x-field-token: $TOKEN" -d "$BODY" \
            | python3 -c "import sys,json;print(json.load(sys.stdin)['model'])")
          test "$MODEL" = "force-gateway-mock (no upstream call made)"
          curl -sf http://localhost:8080/gateway/health | python3 -c "import sys,json;h=json.load(sys.stdin);assert h['mock'] is True and h['enforce'] is True and h['sentinel_url']=='http://sentinel:8004' and h['telemetry_store']=='ok', h"
          curl -sf http://localhost:8080/gateway/telemetry | python3 -c "import sys,json;t=json.load(sys.stdin);assert t['total_requests']==1 and t['rates']['_all']['all']['confidence_tag_rate']==1.0, t"
          curl -sf -X POST http://localhost:8080/killswitch/kill/smoke-egress -H 'content-type: application/json' -d '{"operator":"CI","reason":"F1 compose-smoke"}'
          code=$(curl -s -o "$RUNNER_TEMP/refused.json" -w '%{http_code}' -X POST http://localhost:8080/gateway/v1/messages -H 'content-type: application/json' \
            -H 'x-field-agent-id: smoke-egress' -H "x-field-token: $TOKEN" -d "$BODY")
          test "$code" = 403 || { echo "::error::killed agent answered $code, want 403"; cat "$RUNNER_TEMP/refused.json"; exit 1; }
          python3 -c "import sys,json;r=json.load(open(sys.argv[1]));assert r['decision']=='BLOCK' and r['clause_id']=='E.kill_switch', r" "$RUNNER_TEMP/refused.json"
          curl -sf 'http://localhost:8080/ledger/events?event_type=gateway.refused' | python3 -c "import sys,json;e=json.load(sys.stdin);assert len(e)>=1 and e[-1]['payload']['clause_id']=='E.kill_switch', e"
      - name: Governed smoke flow (BLOCK I.manifest is the correct outcome)
        run: |
          curl -sf -X POST http://localhost:8080/registry/agents -H 'content-type: application/json' \
            -d '{"agent_id":"smoke-agent","name":"Smoke","owner":"CI","domain":"test"}'
          TOKEN=$(curl -sf -X POST http://localhost:8080/delegation/tokens -H 'content-type: application/json' \
            -d '{"agent_id":"smoke-agent","granted_by":"CI","scope":["smoke test"],"ttl_seconds":600}' \
            | python3 -c "import sys,json;print(json.load(sys.stdin)['token_id'])")
          DECISION=$(curl -sf -X POST http://localhost:8080/sentinel/check -H 'content-type: application/json' \
            -d "{\"agent_id\":\"smoke-agent\",\"action\":\"smoke test\",\"token_id\":\"$TOKEN\"}" \
            | python3 -c "import sys,json;d=json.load(sys.stdin);print(d['decision'],d['clause_id'])")
          test "$DECISION" = "BLOCK I.manifest"
          curl -sf http://localhost:8080/ledger/verify | python3 -c "import sys,json;assert json.load(sys.stdin)['ok']"
      - name: Tear down
        if: always()
        working-directory: integration/demo
        run: docker compose down

  fly-image-smoke:
    # Single-container Fly.io estate image (integration/fly/) — same proxy
    # route map and governed flow as compose-smoke, one container instead of
    # fourteen. Build context is the repo root.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build and start the single-container estate
        run: |
          docker build -f integration/fly/Dockerfile --build-arg FIELD_BUILD_SHA="$GITHUB_SHA" -t ff-fly-estate .
          docker run -d --name estate -p 8080:8080 -e FIELD_DATA_DIR=/tmp/field-data ff-fly-estate
      - name: Health checks (every service through the single proxy port)
        # Bounded per-prefix retry (thirteen cold uvicorn starts on one vCPU)
        # replaces the old fixed sleep: up to 30 x 2 s per prefix, fail if a
        # prefix never answers.
        run: |
          wait_health() {
            for i in $(seq 1 30); do
              curl -sf --max-time 5 "$1" > /dev/null && return 0
              sleep 2
            done
            echo "::error::$1 never answered within 60 s"
            return 1
          }
          for svc in registry ledger delegation sentinel killswitch governor replay gateway federation lifecycle attest crosswalk; do
            wait_health "http://localhost:8080/$svc/health" || exit 1
          done
          # console owns the proxy root (catch-all handle) — its /health proves it
          wait_health "http://localhost:8080/health" || exit 1
      - name: Phase G C-6 ledger operator observer is on (startup operator.mode_changed and operator.registry_changed rows for each of the eight operator-block services, mode off)
        # FIELD_LEDGER_OBSERVE_EVERY=60 on the ledger: a service not yet up at the ledger's start-up
        # tick is recorded on the next one, so the script waits up to 150 s.
        run: python3 integration/demo/fixtures/c6-observer/check_rows.py http://localhost:8080/ledger
      - name: Key rotation R2 — the Fly edge refuses /operator/verify-hash and /operator/rotation-state except from the machine's loopback
        # Static twin: tools/tests/test_kr_edge_block_r2.py. From the runner Caddy answers 403; from inside
        # the container the request reaches the service (404: the operator layer is OFF here).
        run: |
          python3 integration/demo/fixtures/kr-edge/check_edge_block.py http://localhost:8080
          docker exec estate python3 -c "
          import sys, urllib.request, urllib.error
          for path in ('registry/operator/rotation-state', 'killswitch/operator/rotation-state', 'operator/rotation-state'):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8080/' + path, timeout=10)
                  code = 200
              except urllib.error.HTTPError as exc:
                  code = exc.code
              print(path, code)
              assert code == 404, (path, code)
          "
      - name: The estate root serves the branded ops console, air-gapped (no external fetches)
        # GET / goes through Caddy's catch-all to the ops-console. The page must be
        # the Force-Field-branded shell, carry its inline icon set (the console has
        # no static route and only "/" is open, so icons are data: URIs), and
        # reference no external or absolute-host URL (customer perimeters are air-gapped).
        run: |
          curl -sf --max-time 10 -D "$RUNNER_TEMP/root.h" -o "$RUNNER_TEMP/root.html" http://localhost:8080/
          grep -qi '^content-type: text/html' "$RUNNER_TEMP/root.h"
          grep -q 'FIELD OPS CONSOLE' "$RUNNER_TEMP/root.html"
          grep -q 'rel="apple-touch-icon"' "$RUNNER_TEMP/root.html"
          grep -q 'rel="icon" type="image/svg+xml"' "$RUNNER_TEMP/root.html"
          grep -q 'the agentic harness for safer AI' "$RUNNER_TEMP/root.html"
          grep -q 'x-field-operator-key' "$RUNNER_TEMP/root.html"
          if grep -n -E '(src|href|action)="(https?:)?//|url\((["'"'"']?)(https?:)?//|@import|fonts\.(googleapis|gstatic)' "$RUNNER_TEMP/root.html"; then
            echo "::error::console page references an external URL"; exit 1
          fi
      - name: Every /health reports the FIELD_BUILD_SHA label baked at build time (v1.2 Phase C)
        # Proves Dockerfile ARG -> ENV -> the entrypoint's children -> /health. The
        # label is what the build was given; nothing checks it against the files.
        run: |
          for p in registry ledger delegation sentinel killswitch governor replay gateway federation lifecycle attest crosswalk ""; do
            url="http://localhost:8080${p:+/$p}/health"
            got=$(curl -sf --max-time 5 "$url" | python3 -c "import sys,json;print(json.load(sys.stdin).get('build_sha'))")
            test "$got" = "$GITHUB_SHA" || { echo "::error::$url build_sha=$got, want $GITHUB_SHA"; exit 1; }
          done
      - name: Governed smoke flow (BLOCK I.manifest is the correct outcome)
        run: |
          curl -sf -X POST http://localhost:8080/registry/agents -H 'content-type: application/json' \
            -d '{"agent_id":"smoke-agent","name":"Smoke","owner":"CI","domain":"test"}'
          TOKEN=$(curl -sf -X POST http://localhost:8080/delegation/tokens -H 'content-type: application/json' \
            -d '{"agent_id":"smoke-agent","granted_by":"CI","scope":["smoke test"],"ttl_seconds":600}' \
            | python3 -c "import sys,json;print(json.load(sys.stdin)['token_id'])")
          DECISION=$(curl -sf -X POST http://localhost:8080/sentinel/check -H 'content-type: application/json' \
            -d "{\"agent_id\":\"smoke-agent\",\"action\":\"smoke test\",\"token_id\":\"$TOKEN\"}" \
            | python3 -c "import sys,json;d=json.load(sys.stdin);print(d['decision'],d['clause_id'])")
          test "$DECISION" = "BLOCK I.manifest"
          curl -sf http://localhost:8080/ledger/verify | python3 -c "import sys,json;assert json.load(sys.stdin)['ok']"
      - name: The image carries the deploy gate's probe and it passes in-container (runbook section 5)
        # The runbook runs this exact command inside the Fly smoke and deployed
        # machines; 2026-10-05's deploy stopped because the image lacked the file.
        run: docker exec estate python3 /platform/tools/estate_probe.py --base http://127.0.0.1:8080 health --expect-build-sha "$GITHUB_SHA"
      - name: The gateway is keyless-real, never a mock (502 naming the key until one is placed)
        run: |
          code=$(curl -s -o "$RUNNER_TEMP/gw.json" -w '%{http_code}' -X POST http://localhost:8080/gateway/v1/messages \
            -H 'content-type: application/json' -d '{"model":"m","max_tokens":8,"messages":[]}')
          test "$code" = 502 || { echo "::error::POST /gateway/v1/messages answered $code, want 502"; exit 1; }
          grep -q ANTHROPIC_API_KEY "$RUNNER_TEMP/gw.json"
          curl -sf http://localhost:8080/gateway/health | python3 -c "import sys,json;h=json.load(sys.stdin);assert h['mock'] is False, h"
      - name: Phase G C-5, no identity secrets (today) - no process presents an identity
        # tools/fly_identity_check.py runs inside the container and prints names, counts and booleans only:
        # every one of the thirteen services is found by its `<service> serve` command line, none carries
        # FIELD_OPERATOR / FIELD_OPERATOR_KEY / FIELD_OPERATOR_KEY_FILE / FIELD_OPERATOR_KEY_<SVC>,
        # /run/field/keys does not exist, /proc/1/environ has no FIELD_OPERATOR= entry, and /health of the
        # eight operator-block services reports no identity.
        run: |
          docker cp tools/fly_identity_check.py estate:/tmp/fly_identity_check.py
          docker exec estate python3 /tmp/fly_identity_check.py --expect none --health http://127.0.0.1:8080
      - name: Phase G C-5, the four per-process identity secrets (FAKE values, not keys) - each daemon has only its own identity
        # A second container from the same image with FIELD_OPERATOR_KEY_<SVC> set to fixed fake strings (no
        # operators file holds their hash). killswitch, registry, delegation and lifecycle each present
        # svc-<name> with their own 0600 key file in a 0700 directory and /health identity_present true; no
        # other process has an identity or inherits a key value; no command line and no log line holds one.
        run: |
          docker run -d --name estate-c5 -e FIELD_DATA_DIR=/tmp/field-data -e FIELD_OPERATOR_KEY_KILLSWITCH=c5FAKEnotakey-killswitch-ci -e FIELD_OPERATOR_KEY_REGISTRY=c5FAKEnotakey-registry-ci -e FIELD_OPERATOR_KEY_DELEGATION=c5FAKEnotakey-delegation-ci -e FIELD_OPERATOR_KEY_LIFECYCLE=c5FAKEnotakey-lifecycle-ci ff-fly-estate
          ready=0
          for i in $(seq 1 45); do
            if docker exec estate-c5 python3 -c "import urllib.request as u; [u.urlopen('http://127.0.0.1:8080' + p + '/health', timeout=5) for p in ('/registry', '/ledger', '/delegation', '/killswitch', '/governor', '/federation', '/lifecycle', '')]" 2>/dev/null; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = 1 || { echo "::error::estate-c5 never answered on the eight operator-block services"; docker logs estate-c5 2>&1 | tail -n 30 | sed 's/c5FAKEnotakey[A-Za-z0-9-]*/<value>/g'; exit 1; }
          docker cp tools/fly_identity_check.py estate-c5:/tmp/fly_identity_check.py
          docker exec estate-c5 python3 /tmp/fly_identity_check.py --expect four --health http://127.0.0.1:8080
          docker logs estate-c5 > "$RUNNER_TEMP/c5.log" 2>&1
          grep -q 'per-process identities svc-killswitch, svc-registry, svc-delegation, svc-lifecycle' "$RUNNER_TEMP/c5.log"
          if grep -q 'c5FAKEnotakey' "$RUNNER_TEMP/c5.log"; then echo "::error::an identity secret value reached the container log"; exit 1; fi
          # Stop path: the four daemons run under a waiting subshell (fly_wait_service); shutdown() must still
          # wait for every service to finish its own graceful shutdown (uvicorn prints one line per process).
          docker stop -t 60 estate-c5 > /dev/null
          docker logs estate-c5 > "$RUNNER_TEMP/c5-stop.log" 2>&1
          grep -q 'stop signal received' "$RUNNER_TEMP/c5-stop.log"
          n=$(grep -c 'Finished server process' "$RUNNER_TEMP/c5-stop.log" || true)
          echo "graceful shutdowns: $n (want 13)"
          test "$n" -ge 13 || { echo "::error::only $n of 13 services finished a graceful shutdown"; exit 1; }
          if grep -q 'c5FAKEnotakey' "$RUNNER_TEMP/c5-stop.log"; then echo "::error::an identity secret value reached the container log"; exit 1; fi
      - name: Phase G C-5, an empty identity secret stops the estate before any service starts
        run: |
          rc=0
          timeout 90 docker run --rm -e FIELD_DATA_DIR=/tmp/field-data -e FIELD_OPERATOR_KEY_KILLSWITCH= -e FIELD_OPERATOR_KEY_REGISTRY=c5FAKEnotakey-registry-ci -e FIELD_OPERATOR_KEY_DELEGATION=c5FAKEnotakey-delegation-ci -e FIELD_OPERATOR_KEY_LIFECYCLE=c5FAKEnotakey-lifecycle-ci ff-fly-estate > "$RUNNER_TEMP/c5-empty.log" 2>&1 || rc=$?
          test "$rc" = 1 || { echo "::error::exit $rc, want 1 (refused start)"; tail -n 20 "$RUNNER_TEMP/c5-empty.log"; exit 1; }
          grep -q 'REFUSING TO START (Phase G C-5): FIELD_OPERATOR_KEY_KILLSWITCH is set but empty' "$RUNNER_TEMP/c5-empty.log"
          if grep -qiE 'uvicorn running|started server process|serving initial configuration' "$RUNNER_TEMP/c5-empty.log"; then echo "::error::a service started"; exit 1; fi
          if grep -q 'c5FAKEnotakey' "$RUNNER_TEMP/c5-empty.log"; then echo "::error::an identity secret value reached the log"; exit 1; fi
      - name: Tear down
        if: always()
        run: |
          docker rm -f estate
          docker rm -f estate-c5 || true

  compose-upgrade-smoke:
    # v1.2 Phase C. The GB10 topology (base file + docker-compose.gb10.yml:
    # read-only field-manifests volume, manifests-admin seed, field-keys in the
    # ledger only) started by the CURRENT images on a /data written the way a
    # pre-Phase-C estate wrote it: a pre-C2 single-file ledger, the pre-v1.2
    # 8-column registry, a pre-D1 governor (7-column spend table, migrated at the
    # D1 governor's first open), manifests on field-data (make_fixture.py). The
    # perimeter secret is random per run and both rosters are armed. Local
    # twin of everything but docker: tools/tests/test_upgrade_smoke_fixture.py.
    runs-on: ubuntu-latest
    env:
      COMPOSE: docker compose -p field-platform -f integration/demo/docker-compose.yml -f integration/demo/docker-compose.gb10.yml
      BASE: http://localhost:18080
      FIELD_BUILD_SHA: ${{ github.sha }}
      FIELD_DOA_ROSTER: /data/doa-roster.yaml
      FIELD_LIFECYCLE_ROSTER: /data/owners.csv
      FIXTURE: integration/demo/fixtures/upgrade-smoke
      # A documentation-range address (RFC 5737) for the GB10 proxy's IP-SAN certificate; the estate
      # supplies its own through FIELD_GB10_LAN_IP in its .env (docker-compose.gb10.yml requires it).
      FIELD_GB10_LAN_IP: 192.0.2.10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Perimeter secret (random per run, masked; never a literal)
        run: |
          secret=$(openssl rand -hex 32)
          echo "::add-mask::$secret"
          echo "FIELD_SHARED_SECRET=$secret" >> "$GITHUB_ENV"
          # F2b: the per-service caller-key bind mounts land in the runner's temp dir (never
          # /home/spinner); empty until the "F2b caller authorship" step. (`runner.temp` is a
          # step-only context, so it is exported here rather than in the job env.)
          echo "FIELD_CALLER_KEYS_DIR=$RUNNER_TEMP/caller-keys" >> "$GITHUB_ENV"
      - name: Build the images (FIELD_BUILD_SHA = this commit)
        run: $COMPOSE build
      - name: Write the OLD-schema /data through the pre-Phase-C topology (base file only)
        # Base file only: /data/manifests is still on field-data, as on a
        # pre-Phase-C GB10. The last line printed is the fixture ledger's pin.
        run: |
          docker compose -p field-platform -f integration/demo/docker-compose.yml \
            run --rm --no-deps -T -v "$PWD/$FIXTURE:/fixture:ro" \
            registry python /fixture/make_fixture.py /data | tee "$RUNNER_TEMP/fixture.out"
          tail -n 1 "$RUNNER_TEMP/fixture.out" > "$RUNNER_TEMP/pin.json"
          python3 -c "import json,sys;p=json.load(open(sys.argv[1]));assert len(p['head_hash'])==64, p" "$RUNNER_TEMP/pin.json"
      - name: Start the GB10 topology on it (secret set, both rosters armed)
        run: $COMPOSE up -d
      - name: Health through the proxy; perimeter on; every /health reports this commit's build arg
        run: |
          wait_health() {
            for i in $(seq 1 30); do
              curl -sf --max-time 5 "$1" > /dev/null && return 0
              sleep 2
            done
            echo "::error::$1 never answered within 60 s"
            return 1
          }
          for svc in registry ledger delegation sentinel killswitch governor replay gateway federation lifecycle attest crosswalk; do
            wait_health "$BASE/$svc/health" || exit 1
          done
          wait_health "$BASE/health" || exit 1
          python3 tools/estate_probe.py --base "$BASE" health --expect-perimeter --expect-build-sha "$GITHUB_SHA"
      - name: GB10 TLS listener (tls internal on 18443, root persisted on caddy_data; phase 1 keeps 18080)
        # Stage 0 transport, docs/runbooks/v1.2-deploy-rollback.md section 8 "GB10 console hop over
        # TLS". Static twin: tools/tests/test_gb10_caddy_tls.py. The root is exported exactly as the
        # runbook tells the owner to, and every TLS check verifies against it (never -k).
        run: |
          set -o pipefail
          ROOT_CRT=/data/caddy/pki/authorities/local/root.crt
          wait_root() {
            for i in $(seq 1 30); do
              $COMPOSE exec -T proxy test -s "$ROOT_CRT" && return 0
              sleep 2
            done
            echo "::error::no internal root CA at $ROOT_CRT in the proxy"
            return 1
          }
          tls_get() {  # $1 = URL, the rest = extra curl options; the leaf is issued at start, so retry briefly
            url="$1"; shift
            for i in $(seq 1 15); do
              curl -sf --max-time 5 --cacert "$RUNNER_TEMP/caddy-root.crt" "$@" -o "$RUNNER_TEMP/tls.json" "$url" && return 0
              sleep 2
            done
            echo "::error::$url did not verify against the exported root"
            return 1
          }
          wait_root || exit 1
          $COMPOSE exec -T proxy cat "$ROOT_CRT" > "$RUNNER_TEMP/caddy-root.crt"
          openssl x509 -in "$RUNNER_TEMP/caddy-root.crt" -noout -subject -enddate
          FP1=$(openssl x509 -in "$RUNNER_TEMP/caddy-root.crt" -noout -fingerprint -sha256)
          # The LAN path: an IP literal sends no SNI, so default_sni picks the <gb10-lan-address> (IP SAN) certificate.
          tls_get https://192.0.2.10:18443/ledger/health --connect-to 192.0.2.10:18443:127.0.0.1:18443 || exit 1
          python3 -c "import sys,json;h=json.load(open(sys.argv[1]));assert 'event_count' in h, h" "$RUNNER_TEMP/tls.json"
          tls_get https://gx10:18443/health --resolve gx10:18443:127.0.0.1 || exit 1
          tls_get https://localhost:18443/registry/health || exit 1
          # Only the internal CA vouches for it: the runner's system trust store must refuse it with a
          # certificate-verification failure (curl exit 60), not any other failure (refused, timeout).
          curl -s --max-time 5 -o /dev/null https://localhost:18443/health && rc=0 || rc=$?
          test "$rc" -eq 60 || { echo "::error::without the exported root curl exited $rc, want 60 (peer certificate not verifiable)"; exit 1; }
          # Same perimeter on both listeners: an unauthenticated request (no x-field-auth) to the same
          # guarded path gets the same 401 over 18443 as over 18080.
          code_http=$(curl -s --max-time 5 -o /dev/null -w '%{http_code}' "http://127.0.0.1:18080/ledger/events")
          code_tls=$(curl -s --max-time 5 -o /dev/null -w '%{http_code}' --cacert "$RUNNER_TEMP/caddy-root.crt" \
            --connect-to 192.0.2.10:18443:127.0.0.1:18443 "https://192.0.2.10:18443/ledger/events")
          test "$code_http" = 401 && test "$code_tls" = "$code_http" \
            || { echo "::error::unauthenticated /ledger/events: 18080 answered $code_http, 18443 answered $code_tls (want 401 on both)"; exit 1; }
          # PHASE 1 of 2: plain HTTP 18080 still answers on the runner's own LAN address (no caller breaks
          # at deploy; the loopback rebind is phase 2, a separate change), and 18443 answers there too.
          LAN=$(hostname -I | awk '{print $1}')
          curl -sf --max-time 5 -o /dev/null "http://$LAN:18080/health" \
            || { echo "::error::plain HTTP 18080 did not answer on $LAN (phase 1 must keep it)"; exit 1; }
          tls_get https://192.0.2.10:18443/health --connect-to "192.0.2.10:18443:$LAN:18443" || exit 1
          # The root survives a recreate with every ANONYMOUS volume renewed: it lives on caddy_data.
          $COMPOSE up -d --no-deps --no-build --force-recreate -V proxy
          wait_root || exit 1
          FP2=$($COMPOSE exec -T proxy cat "$ROOT_CRT" | openssl x509 -noout -fingerprint -sha256)
          test "$FP1" = "$FP2" || { echo "::error::the root CA changed across a recreate: $FP1 -> $FP2"; exit 1; }
          tls_get https://192.0.2.10:18443/health --connect-to 192.0.2.10:18443:127.0.0.1:18443 || exit 1
          docker volume inspect field-platform_caddy_data > /dev/null
      - name: Key rotation R2 — 18080 and the 18443 TLS listener refuse /operator/verify-hash and /operator/rotation-state except from the proxy's loopback
        # Static twin: tools/tests/test_kr_edge_block_r2.py. The perimeter secret is sent (from the env),
        # so a 403 is Caddy's own, not the services' 401. The TLS check verifies the certificate against
        # the root the TLS step exported. From inside the proxy container (loopback, no forwarding hop) the
        # request reaches the service: 401 there, because the proxy holds no perimeter secret.
        run: |
          python3 integration/demo/fixtures/kr-edge/check_edge_block.py "$BASE"
          python3 integration/demo/fixtures/kr-edge/check_edge_block.py https://localhost:18443 --cacert "$RUNNER_TEMP/caddy-root.crt"
          for path in registry/operator/rotation-state killswitch/operator/rotation-state operator/rotation-state; do
            out=$($COMPOSE exec -T proxy wget -S -O /dev/null "http://127.0.0.1:8080/$path" 2>&1 || true)
            echo "$out" | grep -q 'HTTP/1.1 401' || { echo "::error::loopback /$path did not reach the service: $out"; exit 1; }
          done
      - name: manifests-admin seeded once; manifests read-only everywhere; keys in the ledger only
        run: |
          $COMPOSE logs --no-color manifests-admin > "$RUNNER_TEMP/seed.log"
          grep -q "manifests seed: 1 file(s) seeded" "$RUNNER_TEMP/seed.log" || { cat "$RUNNER_TEMP/seed.log"; exit 1; }
          for svc in registry ledger delegation sentinel killswitch governor replay forcegw fedbroker console lifecycle attest crosswalk; do
            $COMPOSE exec -T "$svc" python - /data/manifests ro < "$FIXTURE/check_mount.py"
            $COMPOSE exec -T "$svc" test -f /data/manifests/upgrade-smoke-agent.yaml
          done
          $COMPOSE exec -T ledger python - /data/keys ro < "$FIXTURE/check_mount.py"
          # X4: the witness is the only other key reader (it signs anchor.remote itself). It is behind
          # the profile `witness` (A5), so the plain `up` above did not start it. Keyless here: it
          # contacts nothing (the key is loaded before Fly is read).
          $COMPOSE --profile witness up -d --no-deps witness
          $COMPOSE exec -T witness python - /data/keys ro < "$FIXTURE/check_mount.py"
          # every NON-ledger platform service: a key-volume leak into any reader fails the job
          for svc in registry delegation sentinel killswitch governor replay forcegw fedbroker console lifecycle attest crosswalk; do
            $COMPOSE exec -T "$svc" python - /data/keys absent < "$FIXTURE/check_mount.py"
          done
          # F4/A8: the attest-sign key volume is in attest ONLY (read-only there); every
          # other service — the ledger and the witness included — has no /data/attest-keys
          $COMPOSE exec -T attest python - /data/attest-keys ro < "$FIXTURE/check_mount.py"
          for svc in registry ledger delegation sentinel killswitch governor replay forcegw fedbroker console lifecycle crosswalk witness; do
            $COMPOSE exec -T "$svc" python - /data/attest-keys absent < "$FIXTURE/check_mount.py"
          done
          # F2b: every appending service has its own read-only /run/caller-key (empty before
          # A7b); the ledger holds the keyring, never a caller key
          for svc in registry delegation sentinel killswitch governor replay forcegw fedbroker console lifecycle attest crosswalk witness; do
            $COMPOSE exec -T "$svc" python - /run/caller-key ro < "$FIXTURE/check_mount.py"
          done
          $COMPOSE exec -T ledger python - /run/caller-key absent < "$FIXTURE/check_mount.py"
          $COMPOSE run --rm manifests-admin seed > "$RUNNER_TEMP/reseed.out"
          grep -q "already seeded" "$RUNNER_TEMP/reseed.out" || { cat "$RUNNER_TEMP/reseed.out"; exit 1; }
      - name: The one install command reaches every reader, and refuses a non-manifest
        run: |
          $COMPOSE run --rm manifests-admin install canary-gb10.yaml
          $COMPOSE exec -T sentinel test -f /data/manifests/canary-gb10.yaml
          $COMPOSE exec -T delegation test -f /data/manifests/canary-gb10.yaml
          # the refusal itself (exit 2 + the resolver's reason), not just any non-zero exit
          set +e
          out=$($COMPOSE run --rm -T manifests-admin install doa-roster.example.yaml 2>&1)
          rc=$?
          set -e
          echo "$out"
          test "$rc" -eq 2 || { echo "::error::install of a non-manifest exited $rc, want 2"; exit 1; }
          grep -q "doa-roster.example.yaml would not resolve for a reader" <<<"$out" \
            || { echo "::error::install of a non-manifest was not refused by the resolver check"; exit 1; }
          $COMPOSE exec -T sentinel sh -c '! test -e /data/manifests/doa-roster.example.yaml'
      - name: Phase G C-6 ledger operator observer is on (startup operator.mode_changed and operator.registry_changed rows for each of the eight operator-block services, mode off)
        # FIELD_LEDGER_OBSERVE_EVERY=60 on the ledger: a service not yet up at the ledger's start-up
        # tick is recorded on the next one, so the script waits up to 150 s. Run before upgrade_flow.py:
        # once all eight are recorded the observer appends nothing until a value changes, so that
        # script's /verify-length == /events-count pair cannot straddle an observer append.
        run: python3 integration/demo/fixtures/c6-observer/check_rows.py "$BASE/ledger"
      - name: Positive ALLOW flow through the proxy (register -> cap -> mint under the roster -> check), ledger continuity, pre-D1 governor row, metering and the throttle
        run: python3 "$FIXTURE/upgrade_flow.py" --base "$BASE" --pin "$RUNNER_TEMP/pin.json"
      - name: The gateway in the GB10 topology is keyless-real (v1.2 D2) and its telemetry store is writable
        run: |
          code=$(curl -s -o "$RUNNER_TEMP/gw.json" -w '%{http_code}' -X POST "$BASE/gateway/v1/messages" \
            -H "x-field-auth: $FIELD_SHARED_SECRET" -H 'content-type: application/json' \
            -d '{"model":"m","max_tokens":8,"messages":[]}')
          test "$code" = 502 || { echo "::error::POST /gateway/v1/messages answered $code, want 502"; exit 1; }
          grep -q ANTHROPIC_API_KEY "$RUNNER_TEMP/gw.json"
          curl -sf "$BASE/gateway/health" | python3 -c "import sys,json;h=json.load(sys.stdin);assert h['mock'] is False and h['telemetry_store']=='ok', h"
      - name: F2 fault path (arming step A9, CI-proven only) — the ledger alone recreated with an unreadable sign key and REQUIRE_SIGNING=1
        # --no-deps: only the ledger is recreated; the sentinel keeps running in enforce mode and its
        # step-1 gate reads the new /health. On a live estate this state BLOCKs every agent — hence CI.
        run: |
          wait_ledger() {
            for i in $(seq 1 30); do
              curl -sf --max-time 5 "$BASE/ledger/health" > /dev/null && return 0
              sleep 2
            done
            echo "::error::$BASE/ledger/health never answered within 60 s"; return 1
          }
          FIELD_LEDGER_SIGN_KEY=/data/keys/missing.pem FIELD_LEDGER_REQUIRE_SIGNING=1 \
            $COMPOSE up -d --no-deps --no-build --force-recreate ledger
          wait_ledger || exit 1
          python3 "$FIXTURE/signing_fault.py" "$BASE" upgrade-smoke-agent
          # back to the deployed configuration (blank key, REQUIRE 0): appendable again
          $COMPOSE up -d --no-deps --no-build --force-recreate ledger
          wait_ledger || exit 1
          curl -sf "$BASE/ledger/health" | python3 -c "import sys,json;h=json.load(sys.stdin);assert h['appendable'] is True and h['require_signing'] is False and h['signing']=='off', h"
      - name: F2b caller authorship (arming step A7b, GB10 only) — throwaway keys in the runner's temp dir; keyring + callers first, REQUIRE last
        run: |
          wait_url() { for i in $(seq 1 30); do curl -sf --max-time 5 "$1" > /dev/null && return 0; sleep 2; done; echo "::error::$1 never answered within 60 s"; return 1; }
          AUTH="x-field-auth: $FIELD_SHARED_SECRET"
          IMG=$($COMPOSE images -q ledger)   # every platform image carries /platform/tools/volume_admin.py
          CALLERS="conformance-sentinel force-gateway compliance-crosswalk registry delegation killswitch governor replay fedbroker console lifecycle attest witness"
          for id in $CALLERS; do
            mkdir -p "$FIELD_CALLER_KEYS_DIR/$id"
            docker run --rm --network none -v "$FIELD_CALLER_KEYS_DIR/$id:/keys" "$IMG" \
              python /platform/tools/volume_admin.py keys generate --dir /keys "$id" | grep -q '^fingerprint: [0-9a-f]\{64\}$'
            $COMPOSE run --rm -T keys-admin import-public --dir /keys/callers "$id" < "$FIELD_CALLER_KEYS_DIR/$id/$id.pub.pem" | grep -q '^fingerprint: '
          done
          # a re-import never overwrites (exit 1); a private key on stdin is refused (exit 2)
          set +e
          $COMPOSE run --rm -T keys-admin import-public --dir /keys/callers registry < "$FIELD_CALLER_KEYS_DIR/registry/registry.pub.pem"; test $? -eq 1 || { echo "::error::import-public overwrote a key"; exit 1; }
          sudo cat "$FIELD_CALLER_KEYS_DIR/registry/registry.pem" | $COMPOSE run --rm -T keys-admin import-public --dir /keys/callers extra 2>&1 | grep -q 'not an Ed25519 public key' || { echo "::error::a private key was not refused"; exit 1; }
          set -e
          # keyring on, REQUIRE 0; every caller recreated so it loads its key at start
          FIELD_LEDGER_CALLER_KEYRING=/data/keys/callers $COMPOSE --profile witness up -d --no-build --force-recreate
          for svc in registry ledger delegation sentinel killswitch governor replay gateway federation lifecycle attest crosswalk; do wait_url "$BASE/$svc/health" || exit 1; done
          curl -sf "$BASE/ledger/health" | python3 -c "import sys,json;h=json.load(sys.stdin);assert h['caller_keyring']=='on' and h['caller_keys']==13 and h['require_caller_signature'] is False, h"
          if $COMPOSE logs --no-color sentinel | grep -q "caller signing off"; then echo "::error::the sentinel did not load its caller key"; exit 1; fi
          # the live check: one /check => the sentinel's newest conformance.* event for the agent carries caller_id
          # (ALLOW or a rate-limit BLOCK: both are sentinel appends, and upgrade_flow.py exhausted the 2/h limit)
          curl -sf -X POST "$BASE/sentinel/check" -H "$AUTH" -H 'content-type: application/json' -d '{"agent_id":"upgrade-smoke-agent","action":"upgrade.probe"}' > /dev/null
          curl -sf "$BASE/ledger/events?agent_id=upgrade-smoke-agent" -H "$AUTH" | python3 -c "
          import sys,json
          ev=[e for e in json.load(sys.stdin) if e['event_type'].startswith('conformance.')][-1]
          assert ev.get('caller_id')=='conformance-sentinel' and ev.get('caller_signature') and ev.get('caller_ts') and 'caller_unsigned' not in ev, ev"
          $COMPOSE exec -T ledger ledger verify --path /data/ledger/events.jsonl --caller-keyring /data/keys/callers | tee "$RUNNER_TEMP/caller-verify.out"
          grep -q 'per_caller {.*conformance-sentinel: [1-9]' "$RUNNER_TEMP/caller-verify.out"
          # REQUIRE last (the ledger alone): an unsigned start-type append 403 naming the var, an unsigned kill 201 stamped caller_unsigned, the signed sentinel still appends
          FIELD_LEDGER_CALLER_KEYRING=/data/keys/callers FIELD_LEDGER_REQUIRE_CALLER_SIGNATURE=1 $COMPOSE up -d --no-deps --no-build --force-recreate ledger
          wait_url "$BASE/ledger/health" || exit 1
          code=$(curl -s -o "$RUNNER_TEMP/f2b-403.json" -w '%{http_code}' -X POST "$BASE/ledger/events" -H "$AUTH" -H 'content-type: application/json' -d '{"event_type":"registry.updated","agent_id":"upgrade-smoke-agent","payload":{}}')
          test "$code" = 403 && grep -q FIELD_LEDGER_REQUIRE_CALLER_SIGNATURE "$RUNNER_TEMP/f2b-403.json"
          curl -sf -X POST "$BASE/ledger/events" -H "$AUTH" -H 'content-type: application/json' -d '{"event_type":"kill.agent","agent_id":"upgrade-smoke-agent","payload":{"reason":"F2b CI"}}' \
            | python3 -c "import sys,json;e=json.load(sys.stdin);assert e['caller_unsigned'] is True and 'caller_id' not in e, e"
          curl -sf -X POST "$BASE/sentinel/check" -H "$AUTH" -H 'content-type: application/json' -d '{"agent_id":"upgrade-smoke-agent","action":"upgrade.probe"}' > /dev/null
          curl -sf "$BASE/ledger/events?agent_id=upgrade-smoke-agent" -H "$AUTH" | python3 -c "import sys,json;ev=[e for e in json.load(sys.stdin) if e['event_type'].startswith('conformance.')][-1];assert ev.get('caller_id')=='conformance-sentinel', ev"
          $COMPOSE exec -T ledger ledger verify --path /data/ledger/events.jsonl --caller-keyring /data/keys/callers
          # back to the deployed configuration in the DISARM order: callers first (keys gone), the keyring last
          sudo rm -rf "$FIELD_CALLER_KEYS_DIR"/*/*.pem
          $COMPOSE --profile witness up -d --no-build --force-recreate
          wait_url "$BASE/ledger/health" || exit 1
          curl -sf "$BASE/ledger/health" | python3 -c "import sys,json;h=json.load(sys.stdin);assert h['caller_keyring']=='off' and h['require_caller_signature'] is False and h['appendable'] is True, h"
      - name: Diagnostics
        if: failure()
        run: |
          $COMPOSE ps -a
          $COMPOSE logs --no-color --tail 100
      - name: Tear down
        if: always()
        run: $COMPOSE --profile admin --profile witness down -v
