# GB10 override — the DGX Spark hosts other live workloads on 8000-8010
# (open-webui tool servers, spintrader), so FIELD publishes its single proxy
# port on 18080 instead of 8080. Inter-service traffic rides the compose
# network on the unchanged container ports; ONLY the host-published side
# moves. Access every service through the proxy:
#   http://<gb10>:18080/registry|/ledger|/delegation|/sentinel|/killswitch
#   |/governor|/replay|/gateway|/federation|/lifecycle|/attest|/crosswalk
#   — console (dashboard) at /.
#
# This file also carries the GB10's OPERATING POSTURE (see the sentinel block).
#
# Deploy: FIELD_BUILD_SHA=$(git rev-parse HEAD) docker compose -p field-platform \
#           -f integration/demo/docker-compose.yml \
#           -f integration/demo/docker-compose.gb10.yml up -d --build
# (the full gated sequence is docs/runbooks/v1.2-deploy-rollback.md; without
# FIELD_BUILD_SHA every /health reports build_sha "unknown").
#
# 2026-09-08 decision (Don Hagell): the GB10 is the live demo + dogfood
# estate for Spin State's own agents (ssl-timekeeping-agent,
# ssl-invoicing-agent) and runs in ENFORCE — real BLOCKs, real ESCALATEs.
# The ADR 02 ">= 2 weeks log-only" pilot gate is deliberately NOT being run
# on this estate; if it is ever wanted, set FIELD_SENTINEL_MODE=log_only in
# the GB10 .env and recreate ONLY the sentinel (that resets its clock).
#
# --- Manifests and keys volumes (v1.2 Phase C) ---------------------------------
# field-manifests: mounted READ-ONLY at /data/manifests into EVERY platform
#   service, so no service container can write a file in /data/manifests, and
#   a `docker cp` into /data/manifests cannot land on the field-data copy
#   nobody reads any more (Docker is expected to refuse a copy into a read-only
#   volume mount; not exercised in CI). That is ALL it enforces: manifest_ref
#   is not confined to /data/manifests (an absolute ref or `..` resolves
#   anywhere, and the registry lets manifest_ref be PATCHed — POST /agents refuses
#   an unresolvable ref since v1.2 D3b; PATCH does not), and every service
#   keeps field-data:/data read-write, so a manifest written elsewhere under
#   /data and registered by ref is still honoured. Registered manifest_refs keep
#   their /data/manifests/<id>.yaml paths. The only writer is manifests-admin
#   (tools/volume_admin.py), a one-shot every platform service waits on:
#   - on `up` it runs `manifests seed`. The FIRST run copies /data/manifests
#     from field-data (mounted read-only at /estate) into the empty volume
#     byte for byte and writes a marker; every later run writes nothing. The
#     field-data copy is left in place, frozen, and is no longer read.
#   - THE ONE COMMAND to add or change a manifest, from ~/field-platform
#     after `git pull` (installs NAME from the checkout's manifests/, refused
#     unless it resolves exactly as the readers resolve it; no restart needed,
#     readers re-read on mtime change):
#       docker compose -p field-platform -f integration/demo/docker-compose.yml \
#         -f integration/demo/docker-compose.gb10.yml \
#         run --rm manifests-admin install NAME.yaml [NAME.yaml ...]
# field-keys: mounted READ-ONLY at /data/keys into the ledger and the witness
#   ONLY (the two FIELD_LEDGER_ANCHOR_KEY readers), so FIELD_LEDGER_ANCHOR_KEY=
#   /data/keys/ledger-anchor.pem is the same path as on Fly. Not in the
#   field-data backup. F4's attest signing key is NOT on this volume: see
#   field-attest-keys below. F2's ledger-sign key IS on it (the ledger is its
#   only reader; the witness never signs events).
#   Its writer is keys-admin (profile `admin`, never started by `up`):
#       docker compose -p field-platform -f integration/demo/docker-compose.yml \
#         -f integration/demo/docker-compose.gb10.yml \
#         run --rm keys-admin generate ledger-anchor
#   (Ed25519, 0600 under umask 077, never overwrites, prints only the
#   fingerprint). The PUBLIC key goes off-box at A4, because signatures verify
#   only with the PEM and field-keys is in no backup:
#       docker compose ... run --rm -T keys-admin export-public ledger-anchor > ledger-anchor.pub.pem
#   (the runbook's §4 checks it against the fingerprint with openssl).
#   Rollback note: an image or compose rollback to a pre-Phase-C
#   checkout drops these mounts, and the readers see the frozen field-data
#   copy of /data/manifests again — anything installed since is absent there.
#   The runbook's R1 step 4 copies the volume back first.
# field-attest-keys (v1.2 F4, arming step A8): the served-attestation signing
#   key, mounted READ-ONLY at /data/attest-keys into `attest` ONLY (CI checks
#   every other service has no /data/attest-keys). Its own volume so the ledger
#   never sees the attest key and attest never sees the ledger keys: never reuse
#   one for the other. Its writer is attest-keys-admin (profile `admin`, the
#   same build and entrypoint as keys-admin):
#       docker compose -p field-platform -f integration/demo/docker-compose.yml \
#         -f integration/demo/docker-compose.gb10.yml \
#         run --rm attest-keys-admin generate attest-sign
#       docker compose ... run --rm -T attest-keys-admin export-public attest-sign > attest-sign-gb10.pub.pem
#   then FIELD_ATTEST_SIGNER + FIELD_ATTEST_SIGN_KEY=/data/attest-keys/attest-sign.pem
#   in .env (runbook §4 "Phase F"). Unset => served packs stay UNSIGNED drafts. On
#   Fly the same key lives at /data/keys/attest-sign.pem (single container). Not
#   in the field-data backup; the public PEM goes off-box at A8.
#
# --- networks (v1.2 F1 egress policy, GB10 only) --------------------------------
# `agents` is an INTERNAL network (no default route, no internet). `canary-agent`
# lives ONLY there, so its only LLM path is forcegw (dual-homed): the gateway is
# its mandatory egress and the F-gate proves it (from inside canary-agent a TCP
# connect to api.anthropic.com:443 fails, forcegw:8009 connects). The sentinel,
# kill-switch, delegation, governor and ledger are attached too, so an agent on
# that network can check, heartbeat, mint and be halted (killswitch ->
# canary-agent:8090); the proxy, the console and the internet are not reachable
# from it. Every other GB10 caller (the ssl skills on rog-command, vt on the
# host) and Fly's single container have no such policy — Declared there.
# Removing the block and recreating restores the pre-F topology (env/compose only).
#
# --- witness (v1.2 X4, arming step A5) -------------------------------------------
# A long-running `ledger witness run` on the sealed-ledger image: first tick at
# start, then every FIELD_WITNESS_EVERY seconds (3600). Direction 1: GET Fly's
# OPEN /ledger/health over https, append a signed anchor.remote{estate: fly}
# to THIS ledger through http://ledger:8002 with the perimeter header. It signs
# in its own process with the anchor key (field-keys, read-only here; no served
# route signs). Direction 2 (the GB10 head POSTed to Fly) only after D5, whose
# change places Fly's secret in a file mounted into the witness alone and sets
# FIELD_WITNESS_FLY_SECRET_FILE to that in-container path; unset, every tick
# logs "direction 2 not live (D5)". No published port, no field-data mount
# (the image's VOLUME /data gives it an anonymous, empty /data).
# GB10 down => both directions stop; Fly never initiates without D6.
# A5 is its OWN switch: the service is behind the profile `witness`, so no plain
# `up` (deploy step 9, R1, CI) builds or starts it. A5 arms it with two lines in
# integration/demo/.env, COMPOSE_PROFILES=witness and FIELD_WITNESS_EVERY=3600,
# then brings it up scoped; disarm stops it and deletes both lines
# (docs/runbooks/v1.2-deploy-rollback.md, "X4 witness (A5)"). Once armed, later
# deploys include it like any other service.
# The lifecycle service gets FIELD_WITNESS_EVERY too, BLANK by default: blank =
# no witness finding. Set (A5), its sweep reports a finding when the latest
# anchor.remote{estate: fly} is older than 3 x that interval, or there is none.
x-manifests-reader: &manifests_reader
  # Restated with field-data so /data stays mounted whether a Compose version
  # merges service volumes by target (it does today) or replaces the list.
  volumes:
    - field-data:/data
    - field-manifests:/data/manifests:ro
  # Merged with the base file's depends_on lists (Compose merges depends_on).
  depends_on:
    manifests-admin:
      condition: service_completed_successfully

x-volume-admin-build: &volume_admin_build
  context: ../..
  dockerfile: integration/demo/Dockerfile
  args:
    FIELD_BUILD_SHA: ${FIELD_BUILD_SHA:-unknown}

services:
  proxy:
    ports: !override ["18080:8080"]
  manifests-admin:
    build: *volume_admin_build
    restart: "no"
    network_mode: none
    entrypoint: ["python", "/platform/tools/volume_admin.py", "manifests"]
    command: ["seed"]
    volumes:
      - field-data:/estate:ro
      - field-manifests:/manifests
      - ../../manifests:/src:ro
  keys-admin:
    profiles: [admin]
    build: *volume_admin_build
    restart: "no"
    network_mode: none
    entrypoint: ["python", "/platform/tools/volume_admin.py", "keys"]
    volumes:
      - field-keys:/keys
  attest-keys-admin:
    # F4/A8: the only writer of field-attest-keys (same tool, same verbs).
    profiles: [admin]
    build: *volume_admin_build
    restart: "no"
    network_mode: none
    entrypoint: ["python", "/platform/tools/volume_admin.py", "keys"]
    volumes:
      - field-attest-keys:/keys
  registry: *manifests_reader
  ledger:
    volumes:
      - field-data:/data
      - field-manifests:/data/manifests:ro
      - field-keys:/data/keys:ro
    depends_on:
      manifests-admin:
        condition: service_completed_successfully
    networks: [default, agents]
  delegation:
    <<: *manifests_reader
    networks: [default, agents]
  killswitch:
    <<: *manifests_reader
    networks: [default, agents]
  governor:
    <<: *manifests_reader
    networks: [default, agents]
  replay: *manifests_reader
  forcegw:
    <<: *manifests_reader
    # dual-homed: the only LLM egress reachable from the `agents` network
    networks: [default, agents]
  fedbroker: *manifests_reader
  console: *manifests_reader
  lifecycle:
    <<: *manifests_reader
    # Merged with the base file's environment (Compose merges environment
    # mappings by key, as it merges depends_on above). Blank unless A5 sets
    # FIELD_WITNESS_EVERY in .env: blank = no witness finding, so an estate whose
    # witness is not armed (or was disarmed) never reports one. Set, it is the
    # same value the witness command below runs with.
    environment:
      FIELD_WITNESS_EVERY: ${FIELD_WITNESS_EVERY:-}
  attest:
    # F4/A8: the attest-sign key, read-only, into THIS service only (restated
    # with field-data and field-manifests as the ledger block does above).
    volumes:
      - field-data:/data
      - field-manifests:/data/manifests:ro
      - field-attest-keys:/data/attest-keys:ro
    depends_on:
      manifests-admin:
        condition: service_completed_successfully
  crosswalk: *manifests_reader
  sentinel:
    <<: *manifests_reader
    networks: [default, agents]
    # The full env is restated here rather than relying on cross-file merge of
    # the base x-service anchor: if a Compose version replaced the mapping
    # instead of merging it, the sentinel would silently lose its service URLs.
    environment:
      FIELD_DATA_DIR: /data
      FIELD_REGISTRY_URL: http://registry:8001
      FIELD_LEDGER_URL: http://ledger:8002
      FIELD_DELEGATION_URL: http://delegation:8003
      FIELD_SENTINEL_URL: http://sentinel:8004
      FIELD_KILLSWITCH_URL: http://killswitch:8005
      FIELD_GOVERNOR_URL: http://governor:8006
      FIELD_REPLAY_URL: http://replay:8007
      FIELD_CROSSWALK_URL: http://crosswalk:8008
      FIELD_GATEWAY_URL: http://forcegw:8009
      FORCE_GATEWAY_URL: http://forcegw:8009
      FIELD_FEDERATION_URL: http://fedbroker:8010
      FIELD_LIFECYCLE_URL: http://lifecycle:8012
      FIELD_ATTEST_URL: http://attest:8013
      # Operator passthroughs (v1.2 A0) — restated for the same reason
      # as the URLs above: this block must stay the sentinel's FULL env.
      FIELD_DOA_ROSTER: ${FIELD_DOA_ROSTER:-}
      FIELD_LIFECYCLE_ROSTER: ${FIELD_LIFECYCLE_ROSTER:-}
      FIELD_LIFECYCLE_EVERY: ${FIELD_LIFECYCLE_EVERY:-86400}
      FIELD_CROSSWALK_EVERY: ${FIELD_CROSSWALK_EVERY:-86400}
      FIELD_KILL_ENDPOINT_ALLOWLIST: ${FIELD_KILL_ENDPOINT_ALLOWLIST:-}
      FIELD_LEDGER_RETENTION_DAYS: ${FIELD_LEDGER_RETENTION_DAYS:-2555}
      FIELD_LEDGER_ANCHOR_KEY: ${FIELD_LEDGER_ANCHOR_KEY:-}
      FIELD_LEDGER_SIGN_KEY: ${FIELD_LEDGER_SIGN_KEY:-}
      FIELD_LEDGER_REQUIRE_SIGNING: ${FIELD_LEDGER_REQUIRE_SIGNING:-0}
      FIELD_LEDGER_ARCHIVE_DIR: ${FIELD_LEDGER_ARCHIVE_DIR:-}
      FIELD_ATTEST_SIGNER: ${FIELD_ATTEST_SIGNER:-}
      FIELD_ATTEST_SIGN_KEY: ${FIELD_ATTEST_SIGN_KEY:-}
      FIELD_MANIFEST_DIR: ${FIELD_MANIFEST_DIR:-/data/manifests}
      FIELD_SHARED_SECRET: ${FIELD_SHARED_SECRET:-}
      FIELD_SENTINEL_MODE: ${FIELD_SENTINEL_MODE:-enforce}
      # F1: restated — this block is the sentinel's FULL env (token minted at A10).
      FIELD_SELF_AGENT_ID: conformance-sentinel
      FIELD_SELF_TOKEN_ID: ${FIELD_SENTINEL_SELF_TOKEN:-}
      # --- Semantic judge (ADR 02 S3) — OFF unless the GB10 .env turns it on.
      # To enable, put BOTH of these in the GB10 .env next to this compose file:
      #     FIELD_SENTINEL_JUDGE=anthropic
      #     ANTHROPIC_API_KEY=sk-ant-...
      # WARNING: FIELD_SENTINEL_JUDGE=anthropic WITHOUT a key raises
      # JudgeError inside create_app() and the container will not start.
      # With FORCE_GATEWAY_URL set (v1.2 D2e), judge calls go through forcegw as
      # x-force-passthrough: judge; forcegw must ALSO hold ANTHROPIC_API_KEY (a
      # keyless forcegw answers 502 => JudgeError => D.semantic escalation).
      # Judgments are metered against the sentinel's own governor cap
      # (USD 5/daily, declared in its self_manifest.yaml and applied via
      # PUT /caps/conformance-sentinel); with no cap, or the cap reached,
      # the engine escalates D.semantic instead of judging — never unmetered.
      FIELD_SENTINEL_JUDGE: ${FIELD_SENTINEL_JUDGE:-off}
      FIELD_JUDGE_MODEL: ${FIELD_JUDGE_MODEL:-claude-sonnet-5}
      FIELD_JUDGE_CONFIDENCE_FLOOR: "${FIELD_JUDGE_CONFIDENCE_FLOOR:-0.8}"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  witness:
    # Never started by a plain `up`: A5 activates the profile (COMPOSE_PROFILES=witness in .env).
    profiles: [witness]
    build: *volume_admin_build
    command: ledger witness run --estate gb10 --fly-url https://force-field-sandbox.fly.dev --every ${FIELD_WITNESS_EVERY:-3600}
    restart: unless-stopped
    depends_on: [ledger]
    environment:
      FIELD_LEDGER_URL: http://ledger:8002
      FIELD_SHARED_SECRET: ${FIELD_SHARED_SECRET:-}
      FIELD_LEDGER_ANCHOR_KEY: ${FIELD_LEDGER_ANCHOR_KEY:-}
      # D5 only: a file path inside this container holding Fly's secret. Unset = direction 2 not live.
      FIELD_WITNESS_FLY_SECRET_FILE: ${FIELD_WITNESS_FLY_SECRET_FILE:-}
    # FIELD_BUILD_SHA is the build arg in *volume_admin_build (baked label, no runtime override).
    volumes:
      - field-keys:/data/keys:ro
  canary-agent:
    # v1.2 X3 (arming step A6): the canary-gb10 PROCESS. A long-running
    # `python -m field_agent.canary serve` (packages/field-agent, installed by
    # the platform Dockerfile) serving POST /halt (no field authn; requires
    # x-field-kill-origin: kill-switch; 200 echoing the nonce from the kill
    # reason x3-<nonce>; stops its work loop and NEVER exits) and GET /status
    # {halted, nonce, since}. manifests/canary-gb10.yaml declares
    # http://canary-agent:8090/halt, reached over the compose network by the
    # service name: NO published port. Behind the profile `x3`, so no plain
    # `up` (deploy step 9, R1, CI) builds or starts it. The kill-switch calls it
    # only once A6 sets FIELD_KILL_ENDPOINT_ALLOWLIST=canary-agent in
    # integration/demo/.env; that is deliberately NOT a default here or in the
    # base file (docs/runbooks/v1.2-deploy-rollback.md, "X3 halt endpoint (A6)").
    # Heartbeat polling is OFF unless FIELD_CANARY_HEARTBEAT_EVERY > 0 (a
    # read-only GET, halting on killed or unreachable); the X3 live check runs
    # with it off. A halt is sticky until the container restarts. Fly: nothing
    # until D7 (the (b) row "single-container estate: no agent-side halt endpoint").
    profiles: [x3]
    build: *volume_admin_build
    command: ["python", "-m", "field_agent.canary", "serve", "--agent-id", "canary-gb10", "--port", "8090"]
    restart: unless-stopped
    environment:
      FIELD_CANARY_HEARTBEAT_EVERY: ${FIELD_CANARY_HEARTBEAT_EVERY:-0}
      # read only when polling is on
      FIELD_KILLSWITCH_URL: http://killswitch:8005
      FIELD_SHARED_SECRET: ${FIELD_SHARED_SECRET:-}
    # no field-data, no manifests, no keys: it holds nothing (the image's
    # VOLUME /data gives it an anonymous, empty /data)
    # F1 egress policy: ONLY the internal `agents` network (header note above).
    networks: [agents]

networks:
  default:
  agents:
    internal: true

volumes:
  # New named volumes (field-platform_field-manifests, field-platform_field-keys,
  # field-platform_field-attest-keys).
  # field-data is declared in the base file and is NOT redeclared or renamed.
  field-manifests:
  field-keys:
  field-attest-keys:
