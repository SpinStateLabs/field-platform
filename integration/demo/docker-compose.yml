# FIELD Platform — full stack, single published port.
# VERIFIED 2026-08-08 on GB10 (DGX Spark, aarch64): build, up, health on all
# nine services, governed smoke flow (mint -> sentinel BLOCK I.manifest ->
# ledger verify ok), down. run_demo.sh remains the local no-docker path.
#
# 2026-08-29 productionization: services no longer publish host ports. A
# Caddy reverse proxy (./Caddyfile) is the ONLY published origin (:8080),
# path-routing to every service (/registry, /ledger, ... — console at /).
# Inter-service traffic rides the compose network on the unchanged container
# ports; the FIELD_*_URL anchor below is untouched.
name: field-platform

# --- Phase G operator authentication plumbing (all defaults OFF) -------------
# field_core.operator_auth reads FIELD_OPERATOR_REGISTRY (a path; LOG-ONLY) and
# FIELD_OPERATOR_REQUIRE (1 = ENFORCE). Both are passed ONLY to the eight
# services that import operator_auth (registry, ledger, delegation, killswitch,
# governor, fedbroker, console, lifecycle), as `${VAR:-}`: unset and the empty
# string are the same thing to the code (mode() strips and treats "" as off), so
# a plain `up` is behaviourally identical to pre-plumbing. NEITHER is set here
# and none may be given a literal: arming is the estate's .env, per
# docs/runbooks/v1.2-deploy-rollback.md section 7.
x-operator-auth: &operator_auth
  FIELD_OPERATOR_REGISTRY: ${FIELD_OPERATOR_REGISTRY:-}
  FIELD_OPERATOR_REQUIRE: ${FIELD_OPERATOR_REQUIRE:-}
# Phase G B-6: the operators registry is a DIRECTORY, mounted read-only at
# /run/field/operators/ into the same eight services. The host side is
# FIELD_OPERATORS_DIR, default the committed placeholder directory ./operators/
# next to this file, which holds one file, operators.json, with zero rows, so the
# bind source ALWAYS exists (Compose creates an empty directory at a missing bind
# source: no operators.json in it, so the registry is unreadable). Arming points
# FIELD_OPERATORS_DIR at the host directory and FIELD_OPERATOR_REGISTRY at
# /run/field/operators/operators.json. A directory, not a file, because a bind of
# a single file pins the host inode and a running container never sees a replaced
# file; a directory bind shows the directory's current entries. The ONLY edit
# method is therefore: write the new registry to a temp file IN THAT DIRECTORY,
# then `mv` it onto operators.json (an atomic rename). Never `cat >` into the live
# file (it truncates first, and every guarded request reads the file) and never
# an editor save-as. The file holds only sha256 hashes; it is never baked into an
# image. Runbook section 7.
x-operators-mount: &operators_mount ${FIELD_OPERATORS_DIR:-./operators}:/run/field/operators:ro
# Phase G C-1 (compose part): the four daemon identities, and ONLY those four
# (killswitch, registry, delegation, lifecycle), get FIELD_OPERATOR=svc-<name>
# (an operator id, not a secret) and
# FIELD_OPERATOR_KEY_FILE=/run/field/keys/svc-<name>.key, plus a read-only
# DIRECTORY mount of their OWN key directory at /run/field/keys/ from a
# per-service host variable (FIELD_OPERATOR_KEY_DIR_<SVC>, below), as B-6 does
# for the registry. Every one defaults to a committed placeholder directory
# ./operator-keys/svc-<name>/ holding one EMPTY svc-<name>.key: an empty key
# means the service presents no identity (operator_headers() sends the pair only
# when both id and key are non-empty), so a plain `up` is inert until the host
# key files exist. A directory, not a file: a key rotated on the host by `mv`
# inside the directory is seen by the running daemon (a single-file bind would
# keep the old, revoked key). One directory per daemon, so no daemon can read
# another's key; the file name carries the identity, so a daemon handed the
# wrong directory finds no key (no identity), never another daemon's identity.
# Missing-source trap: a variable that names a host directory which does not
# exist makes Compose create an empty root-owned directory there: no key file,
# no identity; place the key file (0600) in it, no recreate needed. Place and
# `test -s` each key file before the `up` that first names its directory.
# FIELD_OPERATOR_KEY is never set here: the key is never in .env content,
# `docker compose config` or `docker inspect` (a path is).

x-service: &svc
  build:
    context: ../..
    dockerfile: integration/demo/Dockerfile
    # v1.2 Phase C: baked into the image and reported as build_sha by every
    # /health. Pass it on the BUILD command line, never in .env (a stale .env
    # value would be baked into every later build):
    #   FIELD_BUILD_SHA=$(git rev-parse HEAD) docker compose ... build
    # A runtime `environment:` entry would override the baked value, so there
    # is deliberately none.
    args:
      FIELD_BUILD_SHA: ${FIELD_BUILD_SHA:-unknown}
  volumes:
    - field-data:/data
  # Survive host reboots: the GB10 estate was found fully Exited(255) after a
  # reboot on 2026-09-08 (no policy ⇒ nothing came back). Harmless for CI/demo.
  restart: unless-stopped
  # C-151 (reviewer C-142 F-C142-1) hardening that does not change who owns a
  # volume: no privilege gain, no capability except DAC_READ_SEARCH (read the
  # 0600 key files a host user owns; root loses DAC_OVERRIDE otherwise), a
  # read-only root file system with a tmpfs /tmp. Writes go to the field-data
  # volume. The image still runs as root: a non-root USER would need every
  # existing field-data volume chowned (compose-upgrade-smoke), which is Don's
  # call, not made here.
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  cap_add: [DAC_READ_SEARCH]
  read_only: true
  tmpfs: [/tmp]
  environment: &env
    FIELD_DATA_DIR: /data
    FIELD_REGISTRY_URL: http://registry:8001
    FIELD_LEDGER_URL: http://ledger:8002
    FIELD_DELEGATION_URL: http://delegation:8003
    FIELD_SENTINEL_URL: http://sentinel:8004
    FIELD_KILLSWITCH_URL: http://killswitch:8005
    FIELD_GOVERNOR_URL: http://governor:8006
    FIELD_REPLAY_URL: http://replay:8007
    FIELD_CROSSWALK_URL: http://crosswalk:8008
    FIELD_GATEWAY_URL: http://forcegw:8009
    # v1.2 D2e: base URL for the PLATFORM's own LLM calls (sentinel semantic judge,
    # crosswalk suggester, gateway hygiene judge) via field_core.llm; they send
    # x-force-passthrough: judge (+ x-field-auth). FIELD_GATEWAY_URL stays the forcegw CLI target.
    FORCE_GATEWAY_URL: http://forcegw:8009
    FIELD_FEDERATION_URL: http://fedbroker:8010
    FIELD_LIFECYCLE_URL: http://lifecycle:8012
    FIELD_ATTEST_URL: http://attest:8013
    # Sentinel is safe log-only by default; the smoke flow demonstrates
    # enforcement, so this stack opts in (only the sentinel reads it).
    FIELD_SENTINEL_MODE: enforce
    # --- Operator passthroughs (v1.2 A0). Compose forwards NO host env on
    # its own: only these ${VAR:-default} references reach the containers.
    # Blank/default here; set them in the estate .env next to this file with
    # no compose edit at deploy time. Files (rosters) live under /data.
    FIELD_DOA_ROSTER: ${FIELD_DOA_ROSTER:-}
    FIELD_LIFECYCLE_ROSTER: ${FIELD_LIFECYCLE_ROSTER:-}
    FIELD_LIFECYCLE_EVERY: ${FIELD_LIFECYCLE_EVERY:-86400}
    # Read by `crosswalk serve --every` (v1.2 D4): a live https regwatch check of the
    # cited regulatory pages every N seconds; 0 = off. Daily egress from both estates
    # was decided by Don Hagell on 2026-09-13, so the default stays 86400.
    FIELD_CROSSWALK_EVERY: ${FIELD_CROSSWALK_EVERY:-86400}
    FIELD_KILL_ENDPOINT_ALLOWLIST: ${FIELD_KILL_ENDPOINT_ALLOWLIST:-}
    FIELD_LEDGER_RETENTION_DAYS: ${FIELD_LEDGER_RETENTION_DAYS:-2555}
    # C2 rotation signing key: a PEM path under /data (e.g.
    # /data/keys/ledger-anchor.pem). UNSET by default — POST /rotate answers
    # 503 "no anchor key configured" until arming step A4 places the key.
    FIELD_LEDGER_ANCHOR_KEY: ${FIELD_LEDGER_ANCHOR_KEY:-}
    # F2 per-event signing key: a PEM path (e.g. /data/keys/ledger-sign.pem), a
    # SEPARATE key from the anchor key. UNSET by default — events append
    # unsigned and /ledger/health says signing: off. Armed at A7.
    FIELD_LEDGER_SIGN_KEY: ${FIELD_LEDGER_SIGN_KEY:-}
    # F2 fail-closed: 1 refuses start-type appends 503 when no sign key is
    # loaded (stop-type appends land stamped signing_failed). Default 0; armed
    # at A9 only after the A7 soak.
    FIELD_LEDGER_REQUIRE_SIGNING: ${FIELD_LEDGER_REQUIRE_SIGNING:-0}
    # F2b caller authorship (GB10 only, arming step A7b): the ledger's keyring
    # directory of <caller_id>.pub.pem files (GB10: /data/keys/callers on the
    # field-keys volume; written only by `keys-admin import-public`). Blank by
    # default => /ledger/health caller_keyring: off, and a body carrying caller
    # fields is 403 (an unverifiable claim is never stored). Only the ledger reads it.
    FIELD_LEDGER_CALLER_KEYRING: ${FIELD_LEDGER_CALLER_KEYRING:-}
    # F2b fail-closed: 1 refuses (403) every start-type append that carries no
    # caller signature; stop-type appends land stamped caller_unsigned. Default
    # 0; armed LAST at A7b, after the keyring and every service's own key.
    FIELD_LEDGER_REQUIRE_CALLER_SIGNATURE: ${FIELD_LEDGER_REQUIRE_CALLER_SIGNATURE:-0}
    # C2 retention apply target; blank = /data/ledger-archive (same volume).
    FIELD_LEDGER_ARCHIVE_DIR: ${FIELD_LEDGER_ARCHIVE_DIR:-}
    # F4 served attestation signing (arming step A8): the signer name (D10:
    # "Don Hagell (custodian, estate key — standing attestation)") and the PEM
    # path of the attest-sign key (GB10: /data/attest-keys/attest-sign.pem on the
    # attest-only field-attest-keys volume; Fly: /data/keys/attest-sign.pem).
    # Both blank by default => served packs are UNSIGNED drafts; only attest reads them.
    FIELD_ATTEST_SIGNER: ${FIELD_ATTEST_SIGNER:-}
    FIELD_ATTEST_SIGN_KEY: ${FIELD_ATTEST_SIGN_KEY:-}
    FIELD_MANIFEST_DIR: ${FIELD_MANIFEST_DIR:-/data/manifests}
    FIELD_SHARED_SECRET: ${FIELD_SHARED_SECRET:-}

services:
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["8080:8080"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      [registry, ledger, delegation, sentinel, killswitch, governor,
       replay, forcegw, fedbroker, lifecycle, attest, crosswalk, console]
  registry:
    <<: *svc
    command: registry serve --host 0.0.0.0 --port 8001
    environment:
      <<: [*env, *operator_auth]
      # C-1: daemon identity; the key comes only from the mounted directory below
      FIELD_OPERATOR: svc-registry
      FIELD_OPERATOR_KEY_FILE: /run/field/keys/svc-registry.key
    volumes:
      - field-data:/data
      - *operators_mount
      - ${FIELD_OPERATOR_KEY_DIR_REGISTRY:-./operator-keys/svc-registry}:/run/field/keys:ro
  ledger:
    <<: *svc
    command: ledger serve --host 0.0.0.0 --port 8002
    environment:
      <<: [*env, *operator_auth]
      # Phase G C-6: the ledger's own operator observer (sealed_ledger/operator_observer.py).
      # One tick reads the ledger's own /health operator block in process, then one
      # header-less GET /health (in turn; one 3 s deadline for the whole exchange, body capped at 64 KiB)
      # of each service below, the other seven that report an operator block (the
      # flag-bearing eight minus the ledger), and appends operator.mode_changed /
      # operator.registry_changed only at the first observation and on a change. 60 s:
      # ~7 GETs a minute; a target holds a tick for about 3 s at most, seven about 21 s,
      # inside the interval (sealed-ledger README). This
      # arms ONLY the observer; it is not an operator flag (those stay blank above).
      # "0" turns the observer off (then a disarm is no longer ledgered).
      FIELD_LEDGER_OBSERVE_EVERY: ${FIELD_LEDGER_OBSERVE_EVERY:-60}
      FIELD_LEDGER_OBSERVE_HEALTH: agent-registry=http://registry:8001,delegation-authority=http://delegation:8003,kill-switch=http://killswitch:8005,spend-governor=http://governor:8006,federation-broker=http://fedbroker:8010,ops-console=http://console:8011,lifecycle-manager=http://lifecycle:8012
    volumes:
      - field-data:/data
      - *operators_mount
  delegation:
    <<: *svc
    command: delegation serve --host 0.0.0.0 --port 8003
    environment:
      <<: [*env, *operator_auth]
      # C-1: daemon identity; the key comes only from the mounted directory below
      FIELD_OPERATOR: svc-delegation
      FIELD_OPERATOR_KEY_FILE: /run/field/keys/svc-delegation.key
    volumes:
      - field-data:/data
      - *operators_mount
      - ${FIELD_OPERATOR_KEY_DIR_DELEGATION:-./operator-keys/svc-delegation}:/run/field/keys:ro
    depends_on: [registry, ledger]
  sentinel:
    <<: *svc
    command: sentinel serve --host 0.0.0.0 --port 8004
    depends_on: [registry, ledger, delegation, governor]
    environment:
      <<: *env
      # F1: the sentinel's own judge calls carry its self-manifest id + the token
      # minted at A10; a blank token sends no identity => 401 from an enforcing gateway.
      FIELD_SELF_AGENT_ID: conformance-sentinel
      FIELD_SELF_TOKEN_ID: ${FIELD_SENTINEL_SELF_TOKEN:-}
  killswitch:
    <<: *svc
    command: killswitch serve --host 0.0.0.0 --port 8005
    environment:
      <<: [*env, *operator_auth]
      # C-1: daemon identity; the key comes only from the mounted directory below
      FIELD_OPERATOR: svc-killswitch
      FIELD_OPERATOR_KEY_FILE: /run/field/keys/svc-killswitch.key
    volumes:
      - field-data:/data
      - *operators_mount
      - ${FIELD_OPERATOR_KEY_DIR_KILLSWITCH:-./operator-keys/svc-killswitch}:/run/field/keys:ro
    depends_on: [registry, ledger]
  governor:
    <<: *svc
    command: governor serve --host 0.0.0.0 --port 8006
    environment:
      <<: [*env, *operator_auth]
    volumes:
      - field-data:/data
      - *operators_mount
    depends_on: [ledger]
  replay:
    <<: *svc
    command: replay serve --host 0.0.0.0 --port 8007
    depends_on: [registry, ledger, delegation]
  forcegw:
    <<: *svc
    # v1.2 D2: no --mock. Keyless-real unless the estate .env sets FORCE_GATEWAY_MOCK=1
    # (exactly 1): POST /v1/messages answers 502 naming ANTHROPIC_API_KEY until the key
    # is placed (GB10: its .env, next to this file; the key is never in the repo).
    # Telemetry persists at /data/gateway/telemetry.sqlite3.
    command: forcegw serve --host 0.0.0.0 --port 8009
    environment:
      <<: *env
      FORCE_GATEWAY_MOCK: ${FORCE_GATEWAY_MOCK:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      FORCE_TELEMETRY_WINDOW: ${FORCE_TELEMETRY_WINDOW:-50}
      FORCE_TELEMETRY_RETAIN: ${FORCE_TELEMETRY_RETAIN:-10000}
      # F1 (arming A10/A11): exactly "1" enforces; default 0 = today's observer.
      # The sentinel timeout must exceed the sentinel's per-check budget (22 s
      # structural; a judge-on sentinel needs 60 — the A12 precondition).
      FORCE_GATEWAY_ENFORCE: ${FORCE_GATEWAY_ENFORCE:-0}
      FORCE_GATEWAY_TOOL_CHECK: ${FORCE_GATEWAY_TOOL_CHECK:-0}
      FORCE_GATEWAY_SENTINEL_TIMEOUT: ${FORCE_GATEWAY_SENTINEL_TIMEOUT:-30}
      FIELD_SELF_AGENT_ID: force-gateway
      FIELD_SELF_TOKEN_ID: ${FIELD_GATEWAY_SELF_TOKEN:-}
  fedbroker:
    <<: *svc
    command: fedbroker serve --host 0.0.0.0 --port 8010
    environment:
      <<: [*env, *operator_auth]
      FIELD_ORG_NAME: Spin State Labs
    volumes:
      - field-data:/data
      - *operators_mount
    depends_on: [ledger]
  console:
    <<: *svc
    command: console serve --host 0.0.0.0 --port 8011
    environment:
      <<: [*env, *operator_auth]
    volumes:
      - field-data:/data
      - *operators_mount
    depends_on: [registry, ledger, delegation, sentinel, killswitch, governor,
                 lifecycle, attest, crosswalk, fedbroker]
  lifecycle:
    <<: *svc
    command: lifecycle serve --host 0.0.0.0 --port 8012
    environment:
      <<: [*env, *operator_auth]
      # C-1: daemon identity; the key comes only from the mounted directory below.
      # A `docker compose exec lifecycle ...` inherits it too.
      FIELD_OPERATOR: svc-lifecycle
      FIELD_OPERATOR_KEY_FILE: /run/field/keys/svc-lifecycle.key
    volumes:
      - field-data:/data
      - *operators_mount
      - ${FIELD_OPERATOR_KEY_DIR_LIFECYCLE:-./operator-keys/svc-lifecycle}:/run/field/keys:ro
    depends_on: [registry, ledger, delegation, killswitch]
  attest:
    <<: *svc
    command: attest serve --host 0.0.0.0 --port 8013
    depends_on: [registry, ledger, delegation, governor]
  crosswalk:
    <<: *svc
    command: crosswalk serve --host 0.0.0.0 --port 8008
    depends_on: [registry, ledger, delegation, governor]
    environment:
      <<: *env
      # F1: the crosswalk suggester's own LLM calls carry its self id + A10 token.
      FIELD_SELF_AGENT_ID: compliance-crosswalk
      FIELD_SELF_TOKEN_ID: ${FIELD_CROSSWALK_SELF_TOKEN:-}
  approver:
    # Pilot S2: services/claude-approver v0, the Claude Managed Agents client that
    # answers every `always_ask` tool call with the sentinel's verdict. Behind the
    # profile `approver`, so a plain `up` (CI, deploy, R1) never starts it:
    #   docker compose ... --profile approver up -d --no-deps --build approver
    # ALWAYS --no-deps: depends_on below is start ordering for a fresh project
    # only; without it `up --build approver` rebuilds and recreates the
    # sentinel, kill-switch and governor outside the gated runbook sequence.
    # Its OWN image (the only one with the `anthropic` SDK); not in the shared
    # Dockerfile, not on Fly. No published port: the kill-switch reaches
    # POST /halt/{agent} over the compose network (http://approver:8014).
    # The org API key is a FILE in the read-only secrets directory, never an
    # env value: CLAUDE_APPROVER_SECRETS_DIR names the host directory (default:
    # the committed placeholder ./approver-secrets/, git-ignored except its
    # .gitignore, which holds no key, so the service starts inert: /health
    # key_file_present false, no polling, /halt 503). The agent map and any
    # per-estate secret file can live in the same directory
    # (CLAUDE_APPROVER_AGENT_MAP=/run/claude-approver/agent-map.json).
    profiles: [approver]
    build:
      context: ../..
      dockerfile: services/claude-approver/Dockerfile
      args:
        FIELD_BUILD_SHA: ${FIELD_BUILD_SHA:-unknown}
    command: approver serve --host 0.0.0.0 --port 8014
    restart: unless-stopped
    depends_on: [sentinel, killswitch, governor]
    environment:
      <<: *env
      CLAUDE_APPROVER_API_KEY_FILE: /run/claude-approver/api-key
      CLAUDE_APPROVER_AGENT_MAP: ${CLAUDE_APPROVER_AGENT_MAP:-}
      CLAUDE_APPROVER_AGENT_MAP_FILE: ${CLAUDE_APPROVER_AGENT_MAP_FILE:-}
      CLAUDE_APPROVER_TOOL_MAP: ${CLAUDE_APPROVER_TOOL_MAP:-}
      CLAUDE_APPROVER_POLL_SECONDS: ${CLAUDE_APPROVER_POLL_SECONDS:-}
      CLAUDE_APPROVER_ENVIRONMENT_ID: ${CLAUDE_APPROVER_ENVIRONMENT_ID:-}
      CLAUDE_APPROVER_HALT_WAIT_SECONDS: ${CLAUDE_APPROVER_HALT_WAIT_SECONDS:-}
    volumes:
      - field-data:/data
      - ${CLAUDE_APPROVER_SECRETS_DIR:-./approver-secrets}:/run/claude-approver:ro

volumes:
  field-data:
