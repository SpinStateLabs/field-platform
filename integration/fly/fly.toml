# Fly.io Machine config — Force-Field public SANDBOX estate (PRODUCT estate:
# sentinel enforce). The GB10 is a different, private estate (also enforce
# since the 2026-09-08 cutover — docker-compose.gb10.yml) — do not point this
# config at it.
#
# DEPLOY FROM THE REPO ROOT — the Docker build context must contain packages/
# and services/ (the Dockerfile COPYs repo-root paths):
#
#   fly deploy . -c integration/fly/fly.toml --dockerfile integration/fly/Dockerfile
#
# flyctl resolves [build].dockerfile relative to THIS file's directory, so the
# value below is "Dockerfile" (-> integration/fly/Dockerfile), while the build
# context is the working-directory argument (`.` = repo root). The README's
# deploy command also passes --dockerfile explicitly (relative to the context)
# so the resolution is unambiguous on any flyctl version. Be consistent:
# always deploy with the command above, from the repo root.

app = "force-field-sandbox"  # placeholder — rename at launch
primary_region = "yyz"       # pick yours

[build]
  # Relative to this fly.toml per flyctl convention -> integration/fly/Dockerfile.
  # The README deploy command overrides it with an explicit --dockerfile flag.
  dockerfile = "Dockerfile"

[env]
  # Product estate: the sentinel enforces. (Only the sentinel reads this;
  # the entrypoint also defaults it to enforce if unset.)
  FIELD_SENTINEL_MODE = "enforce"
  # FIELD_SHARED_SECRET is set via `fly secrets set FIELD_SHARED_SECRET=...`
  # — NEVER here: fly.toml is committed to the repo.
  # ANTHROPIC_API_KEY (optional, enables real gateway proxying) is likewise
  # a secret, never an [env] entry.

[http_service]
  internal_port = 8080          # Caddy — the container's only 0.0.0.0 listener
  force_https = true            # TLS terminates at the Fly edge
  auto_stop_machines = "off"    # the estate is stateful and always-on
  min_machines_running = 1

# Health checks (v1.2 X0). Without them `fly deploy` reports success the moment
# the machine starts, even if every service behind Caddy is dead — the public
# estate had no checks at all until this. Each path goes THROUGH Caddy to a
# real service, so a dead service fails its check while Caddy stays up. The
# grace period (Fly caps it at 60 s) covers thirteen CPython services cold-starting on one shared
# vCPU. /health stays open under FIELD_SHARED_SECRET (field_core.authn), so the
# checks need no secret.
[[http_service.checks]]
  grace_period = "60s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/registry/health"

[[http_service.checks]]
  grace_period = "60s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/ledger/health"

[[http_service.checks]]
  grace_period = "60s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/sentinel/health"

[[mounts]]
  source = "ff_data"
  destination = "/data"         # FIELD_DATA_DIR — every service's state

# Ten CPython services + caddy did not fit the 256MB default — OOM-verified
# on first deploy (console killed at ~75s); 1GB was measured sufficient for
# those ten. v1.2 A4 (2026-09-12): three more CPython processes now start
# (crosswalk serve :8008, lifecycle serve :8012, attest serve :8013 —
# thirteen services + caddy), so the allocation is raised to 2GB. Not yet
# measured on the estate — needs redeploy by Don; the running Machine keeps
# 1GB until then.
[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 1
