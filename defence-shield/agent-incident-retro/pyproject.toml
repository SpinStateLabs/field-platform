[project]
name = "agent-incident-retro"
version = "0.1.0"
description = "Force-Field-Defence-Shield P1: offline, read-only rogue-agent incident review over web logs, with a signed hash-chained evidence pack."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "field-core",
    "pydantic>=2.6",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
retro = "agent_incident_retro.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_incident_retro"]

[tool.pytest.ini_options]
testpaths = ["tests"]
